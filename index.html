<style>
*{box-sizing:border-box}
:root{
  --bg:#f4f7fb;--card:#fff;--text:#172033;--muted:#68758a;--border:#e8edf4;
  --primary:#1e3a8a;--primary-soft:#eef2ff;--top-bg:#fff;--side-bg:#fff;
  --input-bg:#fff;--input-border:#dbe2ec;--hover:#fafcff;--danger-bg:#feeceb;--danger:#b42318;
  --toast-bg:#172033;--badge:#eef2ff;--received:#f0f3f7;--sent:#e7f0ff;
}
body.dark{
  --bg:#0f172a;--card:#1e293b;--text:#e2e8f0;--muted:#94a3b8;--border:#334155;
  --primary:#60a5fa;--primary-soft:#1e3a5f;--top-bg:#1e293b;--side-bg:#1e293b;
  --input-bg:#0f172a;--input-border:#475569;--hover:#334155;--danger-bg:#450a0a;--danger:#f87171;
  --toast-bg:#1e293b;--badge:#1e3a5f;--received:#334155;--sent:#1e3a5f;
}
body.dark .badge-new{background:#451a03;color:#fcd34d}
body.dark .attach-chip{background:#334155;border-color:#475569}
body.dark .attach-chip a{color:#93c5fd}
body.dark .tpl-chip{background:#1e3a5f;color:#93c5fd;border-color:#334155}
body.dark .tpl-chip:hover{background:#1e3a5f;filter:brightness(1.15)}
body.dark .cal-day .ev{background:#1e3a5f;color:#93c5fd}
body.dark .cal-day .ev.urgent{background:#451a03;color:#fcd34d}
body.dark .bar-row .bar-track{background:#1e3a5f}
body.dark .hl{background:#854d0e;color:#fef08a}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text);transition:background .2s,color .2s}

button,input,textarea,select{font:inherit}button{cursor:pointer}
.hidden{display:none!important}.app{min-height:100vh}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,var(--primary-soft),var(--bg))}
.login-card{width:min(430px,100%);background:var(--card);border-radius:20px;padding:30px;box-shadow:0 15px 45px #00000022}
.logo-img{width:112px;height:112px;display:block;margin:0 auto 16px;border-radius:50%;box-shadow:0 6px 18px #1e3a8a28;border:3px solid #c9a227;object-fit:contain;object-position:center;background:#fff;padding:8px;box-sizing:border-box}
.brand-logo{width:40px;height:40px;border-radius:50%;object-fit:contain;object-position:center;vertical-align:middle;margin-right:8px;border:2px solid #c9a227;background:#fff;padding:3px;box-sizing:border-box}
.brand{display:flex;align-items:center;font-size:17px;font-weight:800;padding:8px 10px 22px;color:var(--primary)}
h1,h2,h3,p{margin-top:0}.muted{color:var(--muted);font-size:14px}.field{margin:15px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}
.field input,.field textarea,.field select{width:100%;border:1px solid var(--input-border);border-radius:10px;padding:11px 12px;outline:none;background:var(--input-bg);color:var(--text)}
.field textarea{min-height:110px;resize:vertical}
.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:700}.primary{background:var(--primary);color:white}.secondary{background:var(--primary-soft);color:var(--primary)}.danger{background:var(--danger-bg);color:var(--danger)}.full{width:100%}
.demo{margin-top:18px;padding:12px;border-radius:10px;background:var(--primary-soft);font-size:13px;line-height:1.7}
.layout{display:flex;min-height:100vh}.side{width:240px;min-width:240px;height:100vh;position:sticky;top:0;background:var(--side-bg);border-right:1px solid var(--border);padding:20px 14px;display:flex;flex-direction:column;overflow:hidden;flex-shrink:0}.nav{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain}

.nav button{width:100%;border:0;background:transparent;text-align:left;padding:12px 13px;border-radius:10px;margin:3px 0;color:var(--muted);font-weight:600;position:relative}
.nav button.active,.nav button:hover{background:var(--primary-soft);color:var(--primary)}
.nav .badge-count{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:#ef4444;color:#fff;font-size:11px;font-weight:700;min-width:20px;height:20px;border-radius:10px;display:grid;place-items:center;padding:0 5px}
.logout{margin-top:auto}
.main{flex:1;min-width:0}.top{height:70px;background:var(--top-bg);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 25px}
.user{font-size:14px;font-weight:700}.content{padding:25px;max-width:1200px;margin:auto}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:20px 0}
.card{background:var(--card);border:1px solid var(--border);border-radius:15px;padding:18px}.num{font-size:28px;font-weight:800;margin-top:8px}
.panel{background:var(--card);border:1px solid var(--border);border-radius:15px;padding:20px;margin-top:18px}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:15px;flex-wrap:wrap}
.list{display:flex;flex-direction:column;gap:10px}
.item{border:1px solid var(--border);border-radius:12px;padding:14px}.item:hover{background:var(--hover)}
.item-head{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.badge{font-size:11px;background:var(--badge);color:var(--primary);padding:4px 8px;border-radius:20px;font-weight:700}
.badge-new{background:#fef3c7;color:#b45309}
.message{padding:14px;border-radius:13px;margin:10px 0;max-width:82%}.received{background:var(--received)}.sent{background:var(--sent);margin-left:auto}
.msg-meta{font-size:11px;color:#718096;margin-bottom:5px}.empty{text-align:center;padding:30px;color:#7b8798}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.toast{position:fixed;right:20px;bottom:20px;background:var(--toast-bg);color:white;padding:13px 16px;border-radius:10px;box-shadow:0 8px 25px #0002;z-index:10}
.attach-chip{display:inline-flex;align-items:center;gap:6px;background:#f0f4f8;border:1px solid #dbe2ec;border-radius:8px;padding:6px 10px;font-size:13px;margin-top:8px}
.attach-chip a{color:#1e3a8a;font-weight:600;text-decoration:none}
.voice-box{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px}.voice-status{font-size:13px;color:#68758a}.voice-player{width:100%;margin-top:8px}.voice-chip{display:flex;align-items:center;gap:8px;background:#f0f4f8;border:1px solid #dbe2ec;border-radius:10px;padding:8px 10px;margin-top:8px}.voice-chip audio{max-width:100%}
.clickable{cursor:pointer}.clickable:hover{background:#f0f7ff}
.version-tag{font-size:11px;color:#94a3b8;font-weight:600;margin-left:6px}
.top-search{display:flex;align-items:center;gap:8px;flex:1;max-width:420px;margin:0 20px}
.top-search input{width:100%;border:1px solid var(--input-border);border-radius:10px;padding:9px 12px;outline:none;background:var(--input-bg);color:var(--text)}
.top-search input:focus{border-color:#1e3a8a;background:#fff}
.read-status{font-size:11px;margin-top:6px}
.read-status.lu{color:#059669}.read-status.nonlu{color:#b45309}
.search-section{margin-bottom:22px}
.search-section h3{margin:0 0 10px;font-size:15px;color:#1e3a8a}
.hl{background:#fef08a;padding:0 2px;border-radius:2px}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:18px 0}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:14px 0}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px}
.stat-card .label{font-size:12px;color:#68758a;font-weight:600}
.stat-card .value{font-size:26px;font-weight:800;margin-top:6px;color:var(--primary)}
.stat-card .sub{font-size:12px;color:#94a3b8;margin-top:4px}
.bar-row{display:flex;align-items:center;gap:10px;margin:8px 0}
.bar-row .bar-label{width:70px;font-size:13px;font-weight:600}
.bar-row .bar-track{flex:1;height:10px;background:#eef2ff;border-radius:6px;overflow:hidden}
.bar-row .bar-fill{height:100%;background:#1e3a8a;border-radius:6px}
.bar-row .bar-count{width:30px;text-align:right;font-size:13px;font-weight:700;color:#526078}
.tpl-chip{display:inline-block;background:#eef2ff;color:#1e3a8a;border:1px solid #c7d7fe;border-radius:20px;padding:6px 12px;font-size:12px;font-weight:700;margin:4px 4px 4px 0;cursor:pointer}
.tpl-chip:hover{background:#dbe7ff}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal-head{font-size:11px;font-weight:700;color:#68758a;padding:8px 0}
.cal-day{min-height:64px;border:1px solid var(--border);border-radius:8px;padding:4px;background:var(--card);text-align:left;font-size:12px}
.cal-day.other{opacity:0.4}
.cal-day.today{border-color:var(--primary);background:var(--primary-soft)}
.cal-day .num{font-weight:700;margin-bottom:2px}
.cal-day .ev{display:block;background:#eef2ff;color:#1e3a8a;border-radius:4px;padding:1px 4px;margin-top:2px;font-size:10px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.cal-day .ev.urgent{background:#fef3c7;color:#b45309}
.event-item{border-left:4px solid var(--primary);padding:12px 14px;background:var(--card);border-radius:0 10px 10px 0;margin:8px 0;border:1px solid var(--border);border-left-width:4px}
.event-item.urgent{border-left-color:#d97706}
@media(max-width:800px){
 .stat-grid{grid-template-columns:repeat(2,1fr)}
 .cal-day{min-height:48px;font-size:10px}
 .btn{min-height:44px;padding:12px 16px}
 .field input,.field textarea,.field select{min-height:44px;font-size:16px}
 .nav button{min-height:48px}
 .login-card{padding:22px 18px}
 .content{padding:14px}

 .side{width:70px;min-width:70px;height:100vh;position:sticky;top:0;padding:10px 7px;overflow:hidden;flex-shrink:0}
 .brand{font-size:0;justify-content:center;padding:8px 2px 14px;flex-shrink:0}.brand .brand-text,.brand .version-tag{display:none}.brand-logo{width:42px;height:42px;margin:0;object-fit:contain;object-position:center;background:#fff;padding:3px;box-sizing:border-box}
 .nav{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scrollbar-width:thin}
 .nav button{font-size:0;text-align:center;padding:12px 6px;min-height:46px;line-height:1}

 .nav button[data-page="teachers"]:before{content:"✍"}
 .nav button[data-page="sms"]:before{content:"📱"}
 .nav button[data-page="affectations"]:before{content:"👥"}
 .nav button[data-page="classes"]:before{content:"☰"}
 .nav button[data-page="subjects"]:before{content:"📘"}
 .nav button[data-page="viescolaire"]:before{content:"🏫"}
 .nav button[data-page="maintenance"]:before{content:"🛠"}
 .nav button[data-page="activity"]:before{content:"📋"}
 .nav button[data-page="bloc2"]:before{content:"Ⅱ"}
 .nav button[data-page="controle"]:before{content:"🛠"}
 .nav button[data-page="bloc3"]:before{content:"🗂"}
 .nav button[data-page="profil"]:before{content:"👤"}
 .nav .badge-count{right:2px;top:4px;transform:none;min-width:17px;height:17px;font-size:10px}
 .logout{font-size:0!important;text-align:center;padding:12px 6px;min-height:46px;flex-shrink:0}
 .logout:before{content:"↪";font-size:20px;display:inline-block;line-height:1.2}
 .cards{grid-template-columns:1fr}.grid2{grid-template-columns:1fr}.content{padding:18px}.top{padding:0 10px;gap:8px;flex-wrap:wrap}
 .top-search{max-width:100%;margin:0;order:3;width:100%}
 .top b{font-size:13px}
 .user{font-size:12px}
}


@media print{
  .side,.top,.top-search,button,.nav,.logout,.toast{display:none!important}
  .layout{display:block}.main{width:100%}.content{padding:0;max-width:100%}
  .panel{border:none;box-shadow:none;padding:0}
  body{background:#fff;color:#000}
}
.theme-toggle{border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:10px;padding:8px 12px;font-weight:700;cursor:pointer}


.grade-table{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}
.grade-table th,.grade-table td{border:1px solid var(--border);padding:8px 10px;text-align:left}
.grade-table th{background:var(--primary-soft);color:var(--primary);font-weight:700}
.grade-table tr:hover{background:var(--hover)}
.grade-good{color:#059669;font-weight:700}
.grade-mid{color:#d97706;font-weight:700}
.grade-low{color:#dc2626;font-weight:700}
.child-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.child-tab{padding:8px 14px;border-radius:20px;border:1px solid var(--border);background:var(--card);cursor:pointer;font-weight:600;font-size:13px;color:var(--muted)}
.child-tab.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.alert-bulletin{background:#fef3c7;border:1px solid #f59e0b;border-radius:12px;padding:14px 16px;margin:12px 0;color:#92400e}
body.dark .alert-bulletin{background:#451a03;border-color:#b45309;color:#fde68a}
.abs-justified{color:#059669}.abs-unjustified{color:#dc2626}


.abs-pending{color:#d97706;font-weight:700}
.abs-rejected{color:#dc2626;font-weight:700}
.status-pill{display:inline-block;padding:3px 8px;border-radius:12px;font-size:11px;font-weight:700}
.status-open{background:#fee2e2;color:#b91c1c}
.status-pending{background:#fef3c7;color:#b45309}
.status-justified{background:#d1fae5;color:#047857}
.status-rejected{background:#fee2e2;color:#b91c1c}
body.dark .status-open,body.dark .status-rejected{background:#450a0a;color:#fca5a5}
body.dark .status-pending{background:#451a03;color:#fcd34d}
body.dark .status-justified{background:#064e3b;color:#6ee7b7}


.sms-bubble{background:var(--primary-soft);border-radius:12px;padding:12px 14px;margin:8px 0;border-left:4px solid var(--primary);font-size:13px}
.sms-meta{font-size:11px;color:var(--muted);margin-bottom:4px}
.sms-status{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700}
.sms-sent{background:#d1fae5;color:#047857}
.sms-failed{background:#fee2e2;color:#b91c1c}
body.dark .sms-sent{background:#064e3b;color:#6ee7b7}

 .quick-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.quick-grid .btn{display:flex;justify-content:space-between;align-items:center}
@media(max-width:700px){.quick-grid{grid-template-columns:1fr}.grid2{grid-template-columns:1fr!important}}

function ensureApiConfig(){
  if (!state) return;
  if (!state.api || typeof state.api !== "object") state.api = {};
  Object.keys(API_DEFAULTS).forEach(function(k){
    if (state.api[k] === undefined) state.api[k] = API_DEFAULTS[k];
  });
  if (!state.api.deviceId) {
    try {
      var d = localStorage.getItem(KEY + "_device_id");
      if (!d) {
        d = "dev-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2,8);
        localStorage.setItem(KEY + "_device_id", d);
      }
      state.api.deviceId = d;
    } catch(e) { state.api.deviceId = "phone-" + Date.now(); }
  }
}

function markLocalChange(){
  if (!state || !state.api) return;
  state.api.localRevision = Number(state.api.localRevision || 0) + 1;
  state.api.pendingChanges = Number(state.api.pendingChanges || 0) + 1;
}

function syncStatusLabel(){
  if (!state || !state.api) return "Local";
  if (state.api.lastSyncStatus === "online") return "En ligne";
  if (state.api.lastSyncStatus === "offline") return "Hors ligne";
  if (state.api.pendingChanges > 0) return "En attente";
  return state.api.enabled ? "Configuré" : "Local";
}

var PP_SYNC_ARRAYS = ["teachers","parents","classes","subjects","sequences","templates","events","annonces","students","messages","bulletins","bulletinRequests","bulletinHistory","grades","absences"];
var PP_SYNC_OBJECTS = ["classPrincipals","supervisor","profiles","smsSettings","whatsappSettings"];
var PP_SHARED = ["messages","bulletins","bulletinRequests","bulletinHistory","grades","absences"];
function syncPayload(){
  var o = {};
  PP_SYNC_ARRAYS.forEach(function(k){ if (Array.isArray(state[k])) o[k] = state[k]; });
  PP_SYNC_OBJECTS.forEach(function(k){ if (state[k] && typeof state[k] === "object") o[k] = state[k]; });
  return o;
}
function scheduleAutoSync(){
  if (window._gescoSyncTimer) clearInterval(window._gescoSyncTimer);
  window._gescoSyncTimer = setInterval(function(){
    if (!state || !state.api || !state.api.enabled || !state.api.baseUrl) return;
    if (typeof document !== "undefined" && document.hidden) return;
    if (state.api.sessionToken && state.user) syncWithServer(true);
    else if (state.api.pendingChanges > 0 || !state.api.lastSyncAt) syncWithServer(true);
  }, 45000);
  window.addEventListener("online", function(){
    if (state && state.api && state.api.enabled) syncWithServer(true);
  });
  document.addEventListener("visibilitychange", function(){
    if (!document.hidden && state && state.api && state.api.enabled && state.api.sessionToken && state.user) syncWithServer(true);
  });
}

function apiUrl(path){
  if (!state || !state.api || !state.api.baseUrl) return "";
  return state.api.baseUrl.replace(/\/$/, "") + path;
}

async function apiRequest(path, options){
  var url = apiUrl(path);
  if (!url) throw new Error("Serveur non configuré");
  var opts = Object.assign({ method:"GET" }, options || {});
  var headers = Object.assign({"Content-Type":"application/json"}, (options && options.headers) || {});
  var isLogin = path.indexOf("/api/auth/login") === 0;
  if (!isLogin && !headers.Authorization && state && state.api && state.api.sessionToken) headers.Authorization = "Bearer " + state.api.sessionToken;
  opts.headers = headers;
  var response = await fetch(url, opts);
  var text = await response.text();
  var data = null;
  try { data = text ? JSON.parse(text) : {}; } catch(e) { data = { raw:text }; }
  if (!response.ok) {
    if (response.status === 401 && !isLogin && state && state.api && state.api.sessionToken) {
      state.api.sessionToken = ""; state.api.sessionExpiresAt = null;
      state.api.lastSyncError = "Session expirée — reconnectez-vous pour synchroniser";
      save(false);
      if (!window._ppSessionToast || Date.now() - window._ppSessionToast > 600000) { window._ppSessionToast = Date.now(); try { toast("Session expirée : déconnectez-vous puis reconnectez-vous pour synchroniser"); } catch(e) {} }
    }
    throw new Error((data && data.error) || ("HTTP " + response.status));
  }
  return data;
}

async function checkServerConnection(){
  try {
    var data = await apiRequest("/api/health");
    state.api.lastSyncStatus = "online";
    state.api.lastSyncAt = new Date().toISOString();
    save(false);
    return data;
  } catch(e) {
    state.api.lastSyncStatus = "offline";
    save(false);
    throw e;
  }
}

async function syncWithServer(silent){
  if (!state.api || !state.api.enabled || !state.api.baseUrl) {
    if (!silent) toast("Serveur central non activé : fonctionnement local conservé");
    return false;
  }
  if (window._gescoSyncBusy) return false;
  window._gescoSyncBusy = true;
  try {
    var payload = {
      schoolId: state.api.schoolId,
      deviceId: state.api.deviceId,
      baseRevision: Number(state.api.serverRevision || 0),
      localRevision: Number(state.api.localRevision || 0),
      changesPending: Number(state.api.pendingChanges || 0),
      state: syncPayload()
    };
    var sentIds = {};
    PP_SHARED.forEach(function(k){ sentIds[k] = {}; (payload.state[k] || []).forEach(function(r){ if (r && r.id != null) sentIds[k][String(r.id)] = 1; }); });
    var revBefore = Number(state.api.serverRevision || 0);
    var result = await apiRequest("/api/sync", { method:"POST", body:JSON.stringify(payload) });
    if (result && result.conflict) {
      state.api.lastSyncStatus = "conflict";
      state.api.lastSyncError = "Conflit détecté — synchronisation non écrasée";
      save(false);
      if (!silent) toast("Conflit détecté : aucune donnée locale n'a été écrasée");
      return false;
    }
    var newMsgs = 0;
    if (result && result.state) {
      var oldMsgIds = {};
      (state.messages || []).forEach(function(m){ oldMsgIds[String(m.id)] = 1; });
      Object.keys(result.state).forEach(function(k){
        var incoming = result.state[k];
        if (Array.isArray(incoming) && PP_SHARED.indexOf(k) !== -1 && Array.isArray(state[k])) {
          var have = {};
          incoming.forEach(function(r){ if (r && r.id != null) have[String(r.id)] = 1; });
          var extra = state[k].filter(function(r){ return r && r.id != null && !have[String(r.id)] && !(sentIds[k] && sentIds[k][String(r.id)]); });
          state[k] = incoming.concat(extra);
        } else state[k] = incoming;
      });
      if (state.user !== "admin") {
        (state.messages || []).forEach(function(m){ if (!oldMsgIds[String(m.id)] && !m.read && m.from !== myLabel() && state.api.lastSyncAt) newMsgs++; });
      }
      if (result.serverWins && result.notice) { try { toast(result.notice); } catch(e) {} }
    }
    if (newMsgs > 0) { try { pushNotif(newMsgs + " nouveau(x) message(s)", "message", null, null); } catch(e) {} }
    state.api.serverRevision = Number((result && result.revision) || state.api.serverRevision || 0);
    var changedOnServer = state.api.serverRevision !== revBefore;
    state.api.pendingChanges = 0;
    state.api.lastSyncStatus = "online";
    state.api.lastSyncAt = new Date().toISOString();
    state.api.lastSyncError = "";
    save(false);
    await syncNotificationsWithServer(true);
    if (!silent) toast("Synchronisation réussie — notifications mises à jour");
    if (changedOnServer) {
      var ae = document.activeElement, typing = ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName) && ae.id !== "loginName" && ae.id !== "loginPass";
      var modalOpen = !!document.querySelector(".modal, .modal-backdrop, #ppForcePwd");
      if (state.user && !typing && !modalOpen) { try { render(); } catch(e) {} }
    }
    return true;
  } catch(e) {
    state.api.lastSyncStatus = "offline";
    state.api.lastSyncError = e.message || "Serveur indisponible";
    save(false);
    if (!silent) toast("Hors ligne : les modifications restent sur ce téléphone");
    console.error("GESCO sync", e);
    return false;
  } finally {
    window._gescoSyncBusy = false;
  }
}

function pruneHeavyData(){
  var pruned = false;

    pruned = true;
  }

    pruned = true;
  }
  if (state.notifications && state.notifications.length > 150) {
    state.notifications = state.notifications.slice(-150);
    pruned = true;
  }
  // Retirer data des pièces jointes des messages les plus anciens (garder les 40 plus récents avec data)
  if (state.messages && state.messages.length > 40) {
    var withData = state.messages.filter(function(m){ return m.attach && m.attach.data; });
    if (withData.length > 40) {
      withData.sort(function(a, b){ return (a.id || 0) - (b.id || 0); });
      var toStrip = withData.slice(0, withData.length - 40);
      toStrip.forEach(function(m){
        if (m.attach) { m.attach.data = null; m.attach.stripped = true; }
      });
      pruned = true;
    }
  }
  return pruned;
}

function hashPassword(plain){
  if (!(window.crypto && crypto.subtle && crypto.subtle.digest)) return Promise.resolve(ppSha256Hex("CST|" + plain + "|Manjo"));

    return Array.from(new Uint8Array(buf)).map(function(b){ return b.toString(16).padStart(2, "0"); }).join("");
  });
}

function isHashed(pwd){
  return typeof pwd === "string" && /^[a-f0-9]{64}$/.test(pwd);
}

function verifyPassword(plain, stored){
  if (!stored) return Promise.resolve(false);
  if (!isHashed(stored)) {
    // Ancien format en clair — accepter puis migrer
    return Promise.resolve(plain === stored);
  }
  return hashPassword(plain).then(function(h){ return h === stored; });
}

/** Hashe tous les mots de passe encore stockés en clair (appelé après chargement) */
function migratePlainPasswords(){
  if (!state) return;
  var jobs = [];
  function queue(getPlain, setHash){
    var plain = getPlain();
    if (!plain || isHashed(plain)) return;
    jobs.push(hashPassword(plain).then(function(h){ setHash(h); }));
  }
  if (state.profiles && state.profiles.admin) {
    queue(function(){ return state.profiles.admin.password; }, function(h){ state.profiles.admin.password = h; });
  }
  (state.teachers || []).forEach(function(t){
    queue(function(){ return t.password; }, function(h){ t.password = h; });
  });
  (state.parents || []).forEach(function(p){
    queue(function(){ return p.password || phoneAsPassword(p.phone); }, function(h){ p.password = h; });
  });
  if (!jobs.length) return;
  Promise.all(jobs).then(function(){
    try { save(); } catch (e) {}
  });
}

function touchSession(){
  if (!state.user) return;
  state.lastActivity = Date.now();
  window._sessionWarned = false;
  try { save(); } catch (e) {}
}

function checkSession(){
  if (!state.user) return true;
  if (!state.lastActivity) {
    state.lastActivity = Date.now();
    return true;
  }
  if (Date.now() - state.lastActivity > SESSION_TIMEOUT_MS) {
    state.user = null;
    state.lastActivity = null;
    window._sessionWarned = false;
    try { save(); } catch (e) {}
    toast("Session expirée — veuillez vous reconnecter");
    render();
    return false;
  }
  return true;
}

var SESSION_WARN_MS = 5 * 60 * 1000; // alerte 5 min avant expiration
window._sessionWarned = false;

function checkSessionWarning(){
  if (!state.user || !state.lastActivity) return;
  var remaining = SESSION_TIMEOUT_MS - (Date.now() - state.lastActivity);
  if (remaining <= 0) {
    checkSession();
    return;
  }
  if (remaining <= SESSION_WARN_MS && !window._sessionWarned) {
    window._sessionWarned = true;
    var mins = Math.max(1, Math.ceil(remaining / 60000));
    toast("Session : expiration dans ~" + mins + " min — bougez ou enregistrez");
  }
  if (remaining > SESSION_WARN_MS) window._sessionWarned = false;
}

// Surveillance périodique de la session
if (!window._sessionTimer) {
  window._sessionTimer = setInterval(function(){
    try { checkSessionWarning(); } catch (e) {}
  }, 30000);
}

function getAccountPassword(userVal){
  if (userVal === "admin") return (state.profiles.admin && state.profiles.admin.password) || "";
  if (userVal === "supervisor:1") return (state.supervisor && state.supervisor.password) || "";
  if (typeof userVal === "string" && userVal.indexOf("teacher:") === 0) {
    var t = (state.teachers || []).find(function(x){ return x.id === Number(userVal.split(":")[1]); });
    return t ? (t.password || "") : "";
  }
  if (typeof userVal === "number") {
    var p = (state.parents || []).find(function(x){ return x.id === userVal; });
    return p ? (p.password || "") : "";
  }
  return "";
}

function setAccountPassword(userVal, hashed){
  if (userVal === "admin") {
    state.profiles.admin.password = hashed;
  } else if (userVal === "supervisor:1") {
    if (state.supervisor) state.supervisor.password = hashed;
  } else if (typeof userVal === "string" && userVal.indexOf("teacher:") === 0) {
    var t = (state.teachers || []).find(function(x){ return x.id === Number(userVal.split(":")[1]); });
    if (t) t.password = hashed;
  } else if (typeof userVal === "number") {
    var p = (state.parents || []).find(function(x){ return x.id === userVal; });
    if (p) p.password = hashed;
  }
}

/** Mot de passe parent = numéro de téléphone normalisé (sans espaces) */

}

function passwordStrength(pwd){
  if (!pwd || pwd.length < MIN_PASSWORD_LEN) return { ok: false, label: "Trop court (min. " + MIN_PASSWORD_LEN + ")" };
  var score = 0;
  if (pwd.length >= 8) score++;
  if (/[A-Z]/.test(pwd)) score++;
  if (/[0-9]/.test(pwd)) score++;
  if (/[^A-Za-z0-9]/.test(pwd)) score++;
  if (score <= 1) return { ok: true, label: "Faible" };
  if (score === 2) return { ok: true, label: "Moyen" };
  return { ok: true, label: "Fort" };
}

    var tname = t ? t.name : "";
    return state.messages.filter(function(m){
      return m.to === tname || m.from === tname || m.recipientRole === "teacher" && Number(m.recipientId) === Number(t.id) || m.senderRole === "teacher" && Number(m.senderId) === Number(t.id) || (m.groupId && m.recipientRole === "teacher" && Number(m.recipientId) === Number(t.id));
    });
  }
  var p = currentParent();
  if (!p) return [];
  var myClasses = (p.children && p.children.length)
    ? p.children.map(function(c){ return c.className; })
    : (p.className ? [p.className] : []);
  return state.messages.filter(function(m){
    if (m.parentId === p.id) return true;
    if (m.to === p.name || m.from === p.name) return true;
    if (m.group === "ALL") return true;
    if (m.group && myClasses.indexOf(m.group) !== -1) return true;
    if (m.groupId && m.recipientRole === "parent" && Number(m.recipientId) === Number(p.id)) return true;
    if ((m.to === "Parent" || m.from === "Parent") && !m.parentId && !m.group) return true;
    return false;
  });
}

function isMsgUnreadForMe(m){
  if (isSupervisor()) {
    var sg = currentSupervisor();
    if (!sg || (m.to !== sg.name && m.recipientRole !== "supervisor" && m.from === sg.name)) return false;
    if (m.readBy && m.readBy["supervisor:1"]) return false;
    return !m.read;
  }
  if (isAdmin()) {
    // Messages destinés à l'admin non lus
    if (m.to === "Administration" && !m.read) return true;
    // Messages groupés : pas de badge "non lu" côté admin
    return false;
  }
  if (isTeacher()) {
    var t = currentTeacher();
    if (!t) return false;
    if (m.to !== t.name && !(m.groupId && m.recipientRole === "teacher" && Number(m.recipientId) === Number(t.id))) return false;
    if (m.readBy && m.readBy["teacher:" + t.id]) return false;
    return !m.read;
  }
  var p = currentParent();
  if (!p) return false;
  // Message groupé : suivi par parent via readBy
  if (m.groupId || m.group) {
    if (!m.readBy) m.readBy = {};
    return !m.readBy["parent:"+p.id];
  }
  // Uniquement les messages REÇUS (pas ceux que j'ai envoyés)
  var isIncoming = (m.to === p.name || m.to === "Parent" || (m.parentId === p.id && m.from === "Administration") || (m.parentId === p.id && m.from !== p.name));
  if (!isIncoming) return false;
  if (m.readBy && m.readBy[p.id]) return false;
  return !m.read;
}

function unreadMessages(){
  return visibleMessages().filter(isMsgUnreadForMe).length;
}

function visibleNotifications(){
  var all = state.notifications || [];
  if (isAdmin()) return all.slice();
  if (isTeacher()) {
    var t = currentTeacher();
    var tname = t ? t.name : "";
    return all.filter(function(n){
      if (n.refType === "message" && n.refId) {
        var m = (state.messages || []).find(function(x){ return x.id === n.refId; });
        if (m && (m.to === tname || m.from === tname)) return true;
        return false;
      }
      if (n.refType === "absence" || n.refType === "bulletin") return false;
      if (n.refType === "annonce") return true;
      if (!n.refType) return true;
      return false;
    });
  }
  var p = currentParent();
  if (!p) return [];
  var kids = (p.children && p.children.length) ? p.children : (p.student ? [{ name: p.student, className: p.className }] : []);
  var kidNames = kids.map(function(c){ return c.name; });
  var myClasses = kids.map(function(c){ return c.className; }).concat(p.className ? [p.className] : []);
  return all.filter(function(n){
    if (n.refType === "message" && n.refId) {
      var m = (state.messages || []).find(function(x){ return x.id === n.refId; });
      if (!m) return false;
      if (m.parentId === p.id || m.to === p.name || m.from === p.name) return true;
      if (m.group === "ALL") return true;
      if (m.group && myClasses.indexOf(m.group) !== -1) return true;
      return false;
    }
    if (n.refType === "absence" || n.refType === "bulletin") {
      return kidNames.some(function(name){ return (n.text || "").indexOf(name) !== -1; });
    }
    if (n.refType === "annonce") return true;
    if (!n.refType) return true;
    return false;
  });
}

function unreadNotifs(){
  return visibleNotifications().filter(function(n){ return !n.read; }).length;
}

function convKey(m){
  if (m.group) return "group:" + m.group;
  if (m.recipientRole === "teacher" && m.recipientId) return "teacher:" + m.recipientId;
  if (m.recipientRole === "parent" && m.recipientId) return "parent:" + m.recipientId;
  if (m.senderRole === "teacher" && m.senderId) return "teacher:" + m.senderId;
  if (m.senderRole === "parent" && m.senderId) return "parent:" + m.senderId;
  if (m.parentId) return "parent:" + m.parentId;
  var names = [m.from, m.to].filter(function(x){ return x && x !== "Administration" && x !== "Parent"; }).sort();
  if (names.length) return "name:" + names[0];
  return "misc:" + m.id;
}

function pushNotif(text, type, refType, refId){
  var n = {
    id: Date.now() * 1000 + (state.notifications.length % 1000),
    text: text, date: nowStr(), read: false,
    type: type || "info", refType: refType || null, refId: refId || null,

function importFullBackup(){
  if (!isAdmin()) return toast("Accès réservé à l'administration");
  document.querySelector(".content").innerHTML = '<div class="panel">'
    + '<div class="panel-head"><h2>Restaurer une sauvegarde</h2>'
    + '<button class="btn secondary" onclick="go(\'profil\')">Retour</button></div>'

function doImportBackup(){
  var input = document.getElementById("backupFile");
  var f = input && input.files && input.files[0];
  if (!f) return toast("Choisissez un fichier");
  if (!confirm("Remplacer toutes les données locales par cette sauvegarde ?")) return;
  var reader = new FileReader();
  reader.onload = function(){
    try {
      var data = JSON.parse(reader.result);
      var st = data.state || data;
      if (!st || typeof st !== "object" || !st.profiles) {
        return toast("Fichier invalide (structure non reconnue)");
      }
      // Conserver l'utilisateur connecté si possible
      var currentUser = state.user;
      state = st;
      if (!state.activityLog) state.activityLog = [];
      state.user = currentUser;
      state.lastActivity = Date.now();
      save();
      logActivity("Restauration sauvegarde", f.name);
      save();
      toast("Sauvegarde restaurée");
      go("home");
    } catch (e) {
      toast("Erreur de lecture JSON");
      console.error(e);
    }
  };
  reader.readAsText(f, "UTF-8");
}

/* ========== SMS SIMULÉS ========== */
function smsEnabled(){
  return state.smsSettings && state.smsSettings.enabled;
}

/** Envoie un SMS simulé vers un numéro. Retourne l'entrée du journal. */
function sendSMS(phone, text, meta){
  if (!phone) return null;
  var ok = smsEnabled();
  // Simulation : 95% de succès si activé
  var success = ok && Math.random() > 0.05;
  var entry = {
    id: Date.now() * 1000 + ((state.smsLog && state.smsLog.length) || 0),
    phone: phone,
    text: String(text).slice(0, 320),
    date: nowStr(),
    status: success ? "sent" : (ok ? "failed" : "disabled"),
    meta: meta || {},
    toName: (meta && meta.toName) || ""
  };
  if (!state.smsLog) state.smsLog = [];
  state.smsLog.push(entry);
  // garder max 200 SMS
  if (state.smsLog.length > 200) state.smsLog = state.smsLog.slice(-200);
  return entry;
}

function smsToParent(parent, text, meta){
  if (!parent || !parent.phone) return null;
  meta = meta || {};
  meta.toName = parent.name;
  return sendSMS(parent.phone, text, meta);
}

function smsToAllParents(text, meta){
  var count = 0;
  (state.parents || []).forEach(function(p){
    if (smsToParent(p, text, meta)) count++;
  });
  return count;
}

function smsToClass(className, text, meta){
  var count = 0;
  (state.parents || []).forEach(function(p){
    var kids = (p.children && p.children.length) ? p.children : (p.className ? [{ className: p.className }] : []);
    var match = kids.some(function(c){ return c.className === className; }) || p.className === className;
    if (match && smsToParent(p, text, meta)) count++;
  });
  return count;
}

/** Déclenche SMS auto selon le type d'événement */
function triggerAutoSMS(kind, payload){
  if (!smsEnabled()) return;
  var s = state.smsSettings || {};
  payload = payload || {};

  if (kind === "message" && s.onMessage) {
    // Message admin → parent précis
    if (payload.parentId) {
      var p = (state.parents || []).find(function(x){ return x.id === payload.parentId; });
      if (p) smsToParent(p, "CST Manjo: Nouveau message — " + (payload.subject || "Sans objet") + ". Connectez-vous au portail.", { type: "message" });
    } else if (payload.group === "ALL") {
      smsToAllParents("CST Manjo: Message de l'administration — " + (payload.subject || "") + ". Voir le portail.", { type: "message", group: "ALL" });
    } else if (payload.group) {
      smsToClass(payload.group, "CST Manjo: Message classe " + payload.group + " — " + (payload.subject || "") + ". Voir le portail.", { type: "message", group: payload.group });
    }
  }
  if (kind === "annonce" && s.onAnnonce) {
    if (payload.target && payload.target !== "Tous") {
      smsToClass(payload.target, "CST Manjo: Annonce — " + (payload.title || "") + ". Consultez le portail.", { type: "annonce" });
    } else {
      smsToAllParents("CST Manjo: Nouvelle annonce — " + (payload.title || "") + ". Consultez le portail.", { type: "annonce" });
    }
  }
  if (kind === "bulletin" && s.onBulletin) {
    var parent = (state.parents || []).find(function(p){
      var kids = (p.children && p.children.length) ? p.children : (p.student ? [{ name: p.student }] : []);
      return kids.some(function(c){ return c.name === payload.student; }) || p.student === payload.student;
    });
    if (parent) {
      var msg = payload.type === "trimestriel"
        ? "CST Manjo: Bulletin trimestriel de " + payload.student + " disponible au collège (à retirer par l'élève)."
        : "CST Manjo: Bulletin " + (payload.sequence || "") + " de " + payload.student + " publié. Consultez le portail.";
      smsToParent(parent, msg, { type: "bulletin" });
    }
  }
  if (kind === "absence" && s.onAbsence) {
    var par = (state.parents || []).find(function(p){
      var kids = (p.children && p.children.length) ? p.children : (p.student ? [{ name: p.student }] : []);
      return kids.some(function(c){ return c.name === payload.student; }) || p.student === payload.student;
    });
    if (par) {
      smsToParent(par, "CST Manjo: " + (payload.text || "Mise à jour d'absence pour " + payload.student) + ". Voir le portail.", { type: "absence" });
    }
  }
}

/* ========== WHATSAPP ========== */
function waEnabled(){
  return state.whatsappSettings && state.whatsappSettings.enabled;
}

/** Normalise un numéro camerounais pour wa.me (ex: 2376XXXXXXXX) */
function normalizePhoneWA(phone){
  if (!phone) return "";
  var digits = String(phone).replace(/\D/g, "");
  if (digits.length === 9 && digits.charAt(0) === "6") digits = "237" + digits;
  if (digits.length === 12 && digits.indexOf("237") === 0) return digits;
  if (digits.length >= 10) return digits;
  return digits;
}

function buildWaLink(phone, text){
  var num = normalizePhoneWA(phone);
  if (!num) return null;
  var msg = encodeURIComponent(String(text || "").slice(0, 1000));
  return "https://wa.me/" + num + (msg ? "?text=" + msg : "");
}

/** Enregistre un envoi WhatsApp et optionnellement ouvre le lien */
function sendWhatsApp(phone, text, meta, openNow){
  if (!phone) return null;
  var ok = waEnabled();
  var link = buildWaLink(phone, text);
  var entry = {
    id: Date.now() * 1000 + ((state.whatsappLog && state.whatsappLog.length) || 0),
    phone: phone,
    phoneWA: normalizePhoneWA(phone),
    text: String(text).slice(0, 1000),
    link: link,
    date: nowStr(),
    status: ok && link ? "ready" : (ok ? "failed" : "disabled"),
    meta: meta || {},
    toName: (meta && meta.toName) || ""
  };
  if (!state.whatsappLog) state.whatsappLog = [];
  state.whatsappLog.push(entry);
  if (state.whatsappLog.length > 200) state.whatsappLog = state.whatsappLog.slice(-200);
  var shouldOpen = openNow !== false && ok && link && state.whatsappSettings && state.whatsappSettings.openLink;
  if (shouldOpen && meta && meta.single) {
    try { window.open(link, "_blank"); } catch (e) {}
  }
  return entry;
}

function waToParent(parent, text, meta, openNow){
  if (!parent || !parent.phone) return null;
  meta = meta || {};
  meta.toName = parent.name;
  return sendWhatsApp(parent.phone, text, meta, openNow);
}

function waToAllParents(text, meta){
  var count = 0;
  (state.parents || []).forEach(function(p){
    if (waToParent(p, text, meta, false)) count++;
  });
  return count;
}

function waToClass(className, text, meta){
  var count = 0;
  (state.parents || []).forEach(function(p){
    var kids = (p.children && p.children.length) ? p.children : (p.className ? [{ className: p.className }] : []);
    var match = kids.some(function(c){ return c.className === className; }) || p.className === className;
    if (match && waToParent(p, text, meta, false)) count++;
  });
  return count;
}

/** Déclenche WhatsApp auto selon le type d'événement */
function triggerAutoWhatsApp(kind, payload){
  if (!waEnabled()) return 0;
  var s = state.whatsappSettings || {};
  payload = payload || {};
  var n = 0;

  if (kind === "message" && s.onMessage) {
    if (payload.parentId) {

    } else if (payload.group) {
      n = waToClass(payload.group, "*CST Manjo* — Message classe " + payload.group + "\n" + (payload.subject || "") + (payload.fullBody ? "\n\n" + payload.fullBody : "\n\nConsultez le portail."), { type: "message", group: payload.group });
    }
  }
  if (kind === "annonce" && s.onAnnonce) {
    var annText = "*CST Manjo — Annonce*\n*" + (payload.title || "") + "*\n\n" + (payload.body || "Consultez le portail.");
    if (payload.target && payload.target !== "Tous") {
      n = waToClass(payload.target, annText, { type: "annonce" });
    } else {
      n = waToAllParents(annText, { type: "annonce" });
    }
  }
  if (kind === "bulletin" && s.onBulletin) {
    var parentB = (state.parents || []).find(function(p){
      var kids = (p.children && p.children.length) ? p.children : (p.student ? [{ name: p.student }] : []);
      return kids.some(function(c){ return c.name === payload.student; }) || p.student === payload.student;
    });
    if (parentB) {
      var msgB = payload.type === "trimestriel"
        ? "*CST Manjo*\nBulletin trimestriel de *" + payload.student + "* disponible au collège (à retirer par l'élève)."
        : "*CST Manjo*\nBulletin " + (payload.sequence || "") + " de *" + payload.student + "* publié. Consultez le portail.";
      waToParent(parentB, msgB, { type: "bulletin", single: true }, true);
      n = 1;
    }
  }
  if (kind === "absence" && s.onAbsence) {
    var parA = (state.parents || []).find(function(p){
      var kids = (p.children && p.children.length) ? p.children : (p.student ? [{ name: p.student }] : []);
      return kids.some(function(c){ return c.name === payload.student; }) || p.student === payload.student;
    });
    if (parA) {
      waToParent(parA, "*CST Manjo*\n" + (payload.text || "Mise à jour d'absence pour " + payload.student) + "\n\nVoir le portail.", { type: "absence", single: true }, true);
      n = 1;
    }
  }
  return n;
}

/* ========== AUTHENTIFICATION SERVEUR — ÉTAPE 3 ========== */
async function serverLogin(username, password){
  if (!state.api || !state.api.baseUrl || !state.api.enabled) return null;
  var data = await apiRequest("/api/auth/login", {
    method:"POST",
    body:JSON.stringify({schoolId: state.api.schoolId || "cst-manjo", username:username, password:password})
  });
  if (!data || !data.token || !data.user) throw new Error("Réponse d'authentification invalide");
  state.api.sessionToken = data.token;
  state.api.sessionExpiresAt = Date.now() + ((data.expiresIn || 43200) * 1000);
  state.api.serverUser = data.user;
  save();
  return data.user;
}
function authHeaders(){
  var h = {"Content-Type":"application/json"};
  if (state && state.api && state.api.sessionToken) h.Authorization = "Bearer " + state.api.sessionToken;
  return h;
}
async function serverRequest(path, options){
  var opts = Object.assign({}, options || {});
  opts.headers = Object.assign({}, authHeaders(), opts.headers || {});
  try {
    return await apiRequest(path, opts);
  } catch(e){
    if (String(e.message || "").toLowerCase().indexOf("session") !== -1) {
      state.api.sessionToken = "";
      state.api.sessionExpiresAt = null;
      save();
    }
    throw e;
  }
}
async function serverLogout(){
  if (!state.api || !state.api.sessionToken) return;
  try { await serverRequest("/api/auth/logout", {method:"POST"}); } catch(e) {}
  state.api.sessionToken = "";
  state.api.sessionExpiresAt = null;
  state.api.serverUser = null;
  save();
}
/* Synchronise le profil local avec le compte serveur lorsque celui-ci existe. */
function applyServerUser(u){
  if (!u) return null;
  var role = normalizeRoleText(u.role || u.type || "");
  var identity = normalizeRoleText(u.username || u.userName || u.name || u.login || "");
  if (role === "admin" || role === "administrateur") state.user = "admin";
  else if (role === "teacher" || role === "enseignant" || role === "professeur") state.user = "teacher:" + u.id;
  else if (role === "parent" || role === "famille") state.user = u.id;
  else if (role === "supervisor" || role === "surveillantgeneral" || role === "surveillant" || identity === "surveillant" || identity === "surveillantgeneral") state.user = "supervisor:1";
  else { state.user = null; throw new Error("Rôle de compte serveur non reconnu : " + String(u.role || u.type || "absent")); }
  state.api.serverUser = u;
  return state.user;
}

function doLogin(){
  var n = document.getElementById("loginName").value.trim();
  var p = document.getElementById("loginPass").value;
  if (!n) return toast("Saisissez un identifiant");
  if (!p) return toast("Saisissez le mot de passe");

  var btn = document.querySelector(".login-card .btn.primary");
  if (btn) { btn.disabled = true; btn.textContent = "Vérification…"; }

  function fail(msg){
    if (btn) { btn.disabled = false; btn.textContent = "Se connecter"; }
    toast(msg || "Identifiants incorrects");
  }

  function localFallback(){
    function succeed(userVal){
      var stored = getAccountPassword(userVal);
      if (!isHashed(stored)) {
        hashPassword(p).then(function(h){
          setAccountPassword(userVal, h);
          login(userVal);
        });
      } else login(userVal);
    }

    if (n.toLowerCase() === "admin") {
      var stored = (state.profiles.admin && state.profiles.admin.password) || "1234";
      return verifyPassword(p, stored).then(function(ok){
        if (!ok) return fail();
        succeed("admin");
      });
    }

    var nLow = n.toLowerCase();
    var teacher = (state.teachers || []).find(function(t){
      return t.name.toLowerCase() === nLow
        || t.name.toLowerCase().indexOf(nLow) !== -1
        || (t.email && t.email.toLowerCase() === nLow);
    });
    if (teacher) {
      if (teacher.active === false) return fail("Compte enseignant désactivé");
      return verifyPassword(p, teacher.password || "").then(function(ok){
        if (!ok) return fail();
        succeed("teacher:" + teacher.id);
      });
    }

    var nPhone = n.replace(/\s/g, "");
    var sg = state.supervisor || {};
    if (sg.active !== false && (nLow === String(sg.username || "surveillant").toLowerCase() || nLow === String(sg.name || "Surveillant général").toLowerCase() || (sg.phone && sg.phone.replace(/\s/g, "") === nPhone))) {
      return verifyPassword(p, sg.password || "").then(function(ok){ if (!ok) return fail(); succeed("supervisor:1"); });
    }
    var found = (state.parents || []).find(function(par){
      return par.name.toLowerCase() === nLow
        || par.name.toLowerCase().indexOf(nLow) !== -1
        || (par.phone && par.phone.replace(/\s/g, "") === nPhone);
    });
    if (!found) return fail("Identifiants incorrects — administration, surveillant, enseignant ou parent");
    if (found.active === false) return fail("Compte parent désactivé");
    var passTry = phoneAsPassword(p) || p;
    verifyPassword(passTry, found.password || phoneAsPassword(found.phone) || "").then(function(ok){
      if (!ok) {
        return verifyPassword(phoneAsPassword(found.phone), found.password).then(function(ok2){
          if (!ok2) return fail();
          succeed(found.id);
        });
      }
      succeed(found.id);
    });
  }

  /* Si le serveur est configuré sur ce téléphone, il devient prioritaire. */
  (window.__ppServerReady || Promise.resolve()).then(function(){
    if (state.api && state.api.enabled && state.api.baseUrl) {
      serverLogin(n, p).then(async function(u){
        applyServerUser(u);
        try { await syncWithServer(true); } catch(e) {}
        login(state.user);
      }).catch(function(e){
        var msg = String((e && e.message) || "");
        if (/incorrect|désactivé|tentatives|requis/i.test(msg)) return fail(msg);
        /* Hors ligne : conserver la possibilité de travailler avec les comptes locaux. */
        localFallback();
      });
    } else {
      localFallback();
    }
  });
}

function requestRecovery(){
  var n = document.getElementById("recId").value.trim();
  if (!n) return toast("Saisissez nom ou téléphone");
  var nLow = n.toLowerCase();
  var nPhone = n.replace(/\s/g, "");
  var account = null;
  var kind = null;
  var id = null;

  if (nLow === "admin") {
    account = state.profiles.admin; kind = "admin"; id = "admin";
  } else {
    var t = (state.teachers || []).find(function(x){
      return x.name.toLowerCase().indexOf(nLow) !== -1 || (x.email && x.email.toLowerCase() === nLow);
    });
    if (t) { account = t; kind = "teacher"; id = t.id; }
    else {
      var p = (state.parents || []).find(function(par){
        return par.name.toLowerCase().indexOf(nLow) !== -1
          || (par.phone && par.phone.replace(/\s/g, "") === nPhone);
      });
      if (p) { account = p; kind = "parent"; id = p.id; }
    }
  }
  if (!account) return toast("Compte introuvable");

  var code = String(Math.floor(100000 + Math.random() * 900000));
  var req = {
    id: Date.now(),
    kind: kind,
    accountId: id,
    name: account.name || "Admin",
    phone: account.phone || "",
    code: code,
    date: nowStr(),
    used: false
  };
  if (!state.recoveryRequests) state.recoveryRequests = [];
  state.recoveryRequests.push(req);
  save();

  // SMS simulé si numéro
  if (account.phone && smsEnabled()) {
    sendSMS(account.phone, "CST Manjo: Votre code de récupération est " + code + ". Valable une seule fois.", { type: "recovery" });
    save();
  }

  document.getElementById("recResult").innerHTML = '<div class="demo" style="background:#d1fae5">'
    + '<b>Code généré (démo)</b><br>'
    + 'Compte : <b>' + esc(req.name) + '</b><br>'
    + 'Code : <b style="font-size:22px;letter-spacing:4px">' + code + '</b><br>'
    + (account.phone ? '<span class="muted">SMS simulé envoyé au ' + esc(account.phone) + '</span><br>' : '')
    + '<button class="btn primary" style="margin-top:10px" onclick="showResetWithCode(\'' + code + '\',\'' + kind + '\',\'' + id + '\')">Réinitialiser le mot de passe</button>'
    + '</div>';
}

function doResetPassword(kind, id){
  var code = document.getElementById("rstCode").value.trim();
  var pass = document.getElementById("rstPass").value;
  var pass2 = document.getElementById("rstPass2").value;
  if (pass !== pass2) return toast("Les mots de passe ne correspondent pas");
  var st = passwordStrength(pass);
  if (!st.ok) return toast(st.label);

  var req = (state.recoveryRequests || []).slice().reverse().find(function(r){
    return !r.used && r.code === code && String(r.kind) === String(kind) && String(r.accountId) === String(id);
  });
  if (!req) return toast("Code invalide ou déjà utilisé");

  hashPassword(pass).then(function(h){
    if (kind === "admin") state.profiles.admin.password = h;
    else if (kind === "teacher") {
      var t = state.teachers.find(function(x){ return x.id === Number(id); });
      if (t) t.password = h;
    } else if (kind === "parent") {
      var p = state.parents.find(function(x){ return x.id === Number(id); });
      if (p) p.password = h;
    }
    req.used = true;
    save();
    toast("Mot de passe réinitialisé — connectez-vous");
    render();
  });
}

/* ========== RECHERCHE GLOBALE ========== */
window._lastSearch = window._lastSearch || "";

function doGlobalSearch(){
  var input = document.getElementById("globalSearch");
  var q = (input && input.value || "").trim();
  window._lastSearch = q;
  if (!q) {
    toast("Saisissez un terme de recherche");
    return;
  }
  page = "search";
  render();
}

function highlight(text, q){
  if (!q) return esc(text);
  var s = String(text ?? "");
  var low = s.toLowerCase();
  var ql = q.toLowerCase();
  var idx = low.indexOf(ql);
  if (idx < 0) return esc(s);
  return esc(s.slice(0, idx)) + '<span class="hl">' + esc(s.slice(idx, idx + q.length)) + '</span>' + esc(s.slice(idx + q.length));
}

function searchView(){
  var q = (window._lastSearch || "").trim();
  var ql = q.toLowerCase();
  if (!q) {
    return '<h1>Recherche</h1><p class="muted">Utilisez la barre en haut pour rechercher.</p>';
  }

  // Messages
  var msgs = visibleMessages().filter(function(m){
    var hay = (m.subject + " " + m.body + " " + m.from + " " + m.to).toLowerCase();
    return hay.indexOf(ql) !== -1;
  }).slice().reverse();

  // Parents (admin only)
  var pars = [];
  if (isAdmin()) {
    pars = (state.parents || []).filter(function(p){
      var kidsStr = (p.children || []).map(function(c){ return c.name + " " + c.className; }).join(" ");
      var hay = (p.name + " " + (p.student||"") + " " + (p.className||"") + " " + p.phone + " " + kidsStr).toLowerCase();
      return hay.indexOf(ql) !== -1;
    });
  }

  // Annonces (filtrées par rôle / classe)
  var anns = (state.annonces || []).filter(function(a){
    var hay = (a.title + " " + a.body + " " + (a.target || "")).toLowerCase();
    if (hay.indexOf(ql) === -1) return false;
    if (isAdmin() || isTeacher()) return true;
    var p = currentParent();
    if (!p) return false;
    if (!a.target || a.target === "Tous") return true;
    var myClasses = (p.children || []).map(function(c){ return c.className; });
    if (p.className) myClasses.push(p.className);
    return myClasses.indexOf(a.target) !== -1;
  }).slice().reverse();

  var total = msgs.length + pars.length + anns.length;

  var html = '<div class="panel-head"><div><h1>Résultats pour « ' + esc(q) + ' »</h1>'
    + '<p class="muted">' + total + ' résultat' + (total > 1 ? "s" : "") + '</p></div>'
    + '<button class="btn secondary" onclick="go(\'home\')">Retour</button></div>';

  if (!total) {
    html += '<div class="panel"><div class="empty">Aucun résultat pour « ' + esc(q) + ' ».</div></div>';
    return html;
  }

  // Messages section
  if (msgs.length) {
    html += '<div class="panel search-section"><h3>✉ Messages (' + msgs.length + ')</h3><div class="list">';
    html += msgs.slice(0, 30).map(function(m){
      var preview = (m.body || "").slice(0, 100);
      return '<div class="item clickable" onclick="openMsg(' + m.id + ')">'
        + '<div class="item-head"><b>' + highlight(m.subject, q) + '</b>'
        + (m.group ? '<span class="badge">Groupé</span>' : '')
        + (isMsgUnreadForMe(m) ? '<span class="badge badge-new">Non lu</span>' : '')
        + '</div>'
        + '<p class="muted">' + esc(m.date) + ' · ' + highlight(m.from, q) + ' → ' + highlight(m.to, q) + '</p>'
        + '<div>' + highlight(preview, q) + (m.body && m.body.length > 100 ? "…" : "") + '</div>'
        + '</div>';
    }).join("");
    html += '</div></div>';
  }

  // Parents section
  if (pars.length) {
    html += '<div class="panel search-section"><h3>♙ Parents (' + pars.length + ')</h3><div class="list">';
    html += pars.map(function(p){
      var kids = (p.children && p.children.length) ? p.children : (p.student ? [{ name: p.student, className: p.className }] : []);
      var kidsLabel = kids.map(function(c){ return highlight(c.name, q) + ' (' + esc(c.className) + ')'; }).join(', ');
      return '<div class="item">'
        + '<div class="item-head"><b>' + highlight(p.name, q) + '</b><span class="badge">' + kids.length + ' élève(s)</span></div>'
        + '<p><b>Élèves :</b> ' + kidsLabel + '</p>'
        + '<p class="muted">Tél. : ' + highlight(p.phone, q) + '</p>'
        + '<button class="btn primary" onclick="messageParent(' + p.id + ')">✉ Écrire</button>'
        + ' <button class="btn secondary" onclick="editParent(' + p.id + ')">Modifier</button>'
        + '</div>';
    }).join("");
    html += '</div></div>';
  }

  // Annonces section
  if (anns.length) {
    html += '<div class="panel search-section"><h3>📢 Annonces (' + anns.length + ')</h3><div class="list">';
    html += anns.map(function(a){
      return '<div class="item clickable" onclick="go(\'annonces\')">'
        + '<div class="item-head"><b>' + highlight(a.title, q) + '</b>'
        + '<span class="muted">' + esc(a.date) + (a.target ? " · " + esc(a.target) : "") + '</span></div>'
        + '<p>' + highlight((a.body || "").slice(0, 140), q) + ((a.body || "").length > 140 ? "…" : "") + '</p>'
        + '</div>';
    }).join("");
    html += '</div></div>';
  }

  return html;
}

/* ========== MESSAGERIE CENTRALISÉE — ÉTAPE 5 ========== */
function messageDeliveryLabel(m){
  var st=m.deliveryStatus||((state.api&&state.api.enabled)?"queued":"local");
  return st==="read"?"✓✓ Lu":st==="delivered"?"✓✓ Distribué":st==="sent"?"✓ Envoyé":st==="queued"?"⏳ En attente":"📱 Local";
}
function messageDeliveryDetail(m){
  var parts=[];
  if(m.sentAt) parts.push("Envoyé : "+m.sentAt);
  if(m.deliveredAt) parts.push("Distribué : "+m.deliveredAt);
  if(m.readAt) parts.push("Lu : "+m.readAt);
  return parts.join("\n");
}
async function publishMessageToServer(msg){
  if(!state.api || !state.api.enabled || !state.api.baseUrl || !state.api.sessionToken){
    msg.deliveryStatus=msg.deliveryStatus||"local";
    return false;
  }
  try{
    var r=await apiRequest("/api/messages",{method:"POST",body:JSON.stringify({schoolId:state.api.schoolId,deviceId:state.api.deviceId,message:msg})});
    if(r&&r.message) Object.assign(msg,r.message);
    var st=(r&&r.status)||"sent";
    msg.deliveryStatus=st==="read"?"read":(st==="delivered"?"delivered":"sent");
    if(!msg.sentAt) msg.sentAt=nowStr();
    if(msg.deliveryStatus==="delivered" && !msg.deliveredAt) msg.deliveredAt=nowStr();
    return true;
  }catch(e){ msg.deliveryStatus="queued"; msg.deliveryError=e.message||"Serveur indisponible"; return false; }
}
async function markMessageReadOnServer(msg){
  if(!state.api || !state.api.enabled || !state.api.baseUrl || !state.api.sessionToken) return;
  try{
    var r=await apiRequest("/api/messages/"+encodeURIComponent(msg.id)+"/read",{method:"POST",body:JSON.stringify({schoolId:state.api.schoolId,deviceId:state.api.deviceId,readAt:msg.readAt||nowStr()})});
    msg.deliveryStatus="read";
    if(!msg.readAt) msg.readAt=nowStr();
    if(!msg.deliveredAt) msg.deliveredAt=msg.readAt;
    if(r&&r.message) Object.assign(msg,r.message);
    save(false);
  }catch(e){}
}
async function retryPendingMessages(){
  if(!state.api || !state.api.enabled) return toast("Serveur central non configuré");
  var pending=(state.messages||[]).filter(function(m){return m.deliveryStatus==="queued";});
  var n=0;
  for(var i=0;i<pending.length;i++) if(await publishMessageToServer(pending[i])) n++;
  if(n) save(false);
  toast(n+" message(s) synchronisé(s)");
}
function messageDeliveryBadge(m){
  var title=messageDeliveryDetail(m);
  if(m.deliveryError) title+=(title?'\n':'')+m.deliveryError;
  return '<span class="badge" title="'+esc(title)+'">'+messageDeliveryLabel(m)+'</span>';
}
/* ========== MESSAGES ========== */
function messages(){
  var admin = isAdmin();
  var list = visibleMessages().slice().reverse();

  // Grouper en conversations
  var convMap = {};
  list.forEach(function(m){
    var key = convKey(m);
    if (!convMap[key]) {
      convMap[key] = {
        key: key,
        messages: [],
        last: m,
        unread: 0,
        title: "",
        subtitle: ""
      };
    }
    convMap[key].messages.push(m);
    if (isMsgUnreadForMe(m)) convMap[key].unread++;
    // garder le plus récent comme last (list est déjà reverse chronologique)
    if (!convMap[key].last || m.id > convMap[key].last.id) convMap[key].last = m;
  });

  var convs = Object.keys(convMap).map(function(k){ return convMap[k]; });
  // trier par date du dernier message
  convs.sort(function(a, b){ return (b.last.id || 0) - (a.last.id || 0); });

  // libellés
  convs.forEach(function(c){
    var m = c.last;
    if (m.group) {
      c.title = m.group === "ALL" ? "Message groupé — Tous les parents" : "Message groupé — Classe " + m.group;
      c.subtitle = "Administration → " + m.to;
    } else if (admin || isTeacher()) {
      var other = m.from === myLabel() ? m.to : m.from;
      c.title = other || "Conversation";
      var par = (state.parents || []).find(function(p){ return p.id === m.parentId || p.name === other; });
      var teach = (state.teachers || []).find(function(t){ return t.id === m.recipientId && m.recipientRole === "teacher" || t.id === m.senderId && m.senderRole === "teacher" || t.name === other; });
      c.subtitle = par
        ? ((par.children && par.children[0] ? par.children[0].name : par.student) + " · " + (par.children && par.children[0] ? par.children[0].className : par.className))
        : (teach ? ("Enseignant · " + (teach.subjects || []).join(", ")) : (m.from + " ↔ " + m.to));
    } else {
      c.title = m.from === myLabel() ? m.to : m.from;
      if (c.title === myLabel()) c.title = "Administration";
      c.subtitle = m.subject || "Conversation";
    }
  });

  var convHtml = convs.map(function(c){
    var m = c.last;
    var preview = (m.body || "").slice(0, 90) + (m.body && m.body.length > 90 ? "…" : "");
    var badge = c.unread ? '<span class="badge badge-new">' + c.unread + ' non lu' + (c.unread > 1 ? "s" : "") + '</span>' : "";
    var groupBadge = m.group ? '<span class="badge">Groupé</span>' : "";
    var meName = myLabel();
    var hasIncoming = c.messages.some(function(x){ return x.from !== meName; });
    var hasOutgoing = c.messages.some(function(x){ return x.from === meName; });
    var flow = hasIncoming && hasOutgoing ? "both" : (hasOutgoing ? "sent" : "received");
    return '<div class="item clickable" data-flow="' + flow + '" onclick="openConversation(\'' + c.key.replace(/'/g, "\\'") + '\')">'
      + '<div class="item-head"><b>' + esc(c.title) + '</b>' + badge + groupBadge + '</div>'
      + '<p class="muted">' + esc(m.date) + ' · ' + esc(c.subtitle) + '</p>'
      + '<div><b>' + esc(m.subject) + '</b> — ' + esc(preview) + '</div>'
      + '</div>';
  }).join("") || empty();

  return '<div class="panel-head">'
    + '<div><h1>Boîte de réception</h1><p class="muted">'
    + (admin ? "Conversations avec les parents et messages groupés." : "Vos échanges avec l'administration.")
    + '</p></div>'
    + '<div>'
    + '<button class="btn primary" onclick="compose()">Nouveau message</button> <button class="btn secondary" onclick="markAllMessagesRead()">✓ Tout marquer lu</button> <button class="btn secondary" onclick="retryPendingMessages()">↻ Synchroniser</button> <button class="btn secondary" onclick="openTrash()">🗑 Corbeille</button>'
    + (admin ? ' <button class="btn secondary" onclick="composeGroup()">Message groupé</button>' : "")
    + '</div></div>'
    + '<div class="panel">'
    + '<div class="grid2" style="margin-bottom:14px">'
    + '<div class="field" style="margin:0"><label>Rechercher</label>'
    + '<input id="msgSearch" oninput="filterConversations()" placeholder="Objet, message ou contact..."></div>'
    + '<div class="field" style="margin:0"><label>Filtre</label>'
    + '<select id="msgFilter" onchange="filterConversations()">'
    + '<option value="all">Toutes les conversations</option>'
    + '<option value="received">Reçues</option>'
    + '<option value="sent">Envoyées</option>'
    + '<option value="unread">Non lues</option>'
    + '</select></div></div>'
    + '<div class="list" id="msgList">' + convHtml + '</div></div>'
    + '<div class="panel" style="margin-top:14px"><div class="panel-head"><div><h2>📝 Brouillons</h2><p class="muted">Messages enregistrés sur ce téléphone.</p></div></div>'
    + (((state.drafts||[]).slice().reverse().map(function(d){return '<div class="item"><div class="item-head"><b>'+esc(draftLabel(d))+'</b><span class="badge">Brouillon</span></div><p class="muted">'+esc(d.date||"")+'</p><div>'+esc((d.body||"").slice(0,100))+'</div><div style="margin-top:8px"><button class="btn secondary" onclick="editDraft('+d.id+')">Modifier</button> <button class="btn secondary" onclick="deleteDraft('+d.id+')">Supprimer</button></div></div>';}).join("")) || empty()) + '</div>';
}

function filterConversations(){
  var q = (document.getElementById("msgSearch") && document.getElementById("msgSearch").value || "").toLowerCase();
  var f = (document.getElementById("msgFilter") && document.getElementById("msgFilter").value) || "all";
  var items = document.querySelectorAll("#msgList .item");
  items.forEach(function(el){
    var text = (el.textContent || "").toLowerCase();
    var okQ = !q || text.indexOf(q) !== -1;
    var flow = el.getAttribute("data-flow") || "received";
    var okF = f === "all" || (f === "unread" && (el.querySelector(".badge-new") || /non lu/i.test(el.textContent || ""))) || (f === "received" && (flow === "received" || flow === "both")) || (f === "sent" && (flow === "sent" || flow === "both"));
    el.style.display = (okQ && okF) ? "" : "none";
  });
}

function openConversation(key){
  if (String(key).indexOf("group:")===0) return openGroupConversation(String(key).slice(6));
  var msgs = visibleMessages().filter(function(m){ return convKey(m) === key; });
  msgs.sort(function(a, b){ return (a.id || 0) - (b.id || 0); });

  // Marquer comme lus les messages destinés à moi (+ accusé de lecture par destinataire)
  var marked = false;
  msgs.forEach(function(m){
    if (!isMsgUnreadForMe(m)) return;
    if (!m.deliveredAt) { m.deliveredAt = nowStr(); if (m.deliveryStatus !== "read") m.deliveryStatus = "delivered"; }
    if (!m.readBy) m.readBy = {};
    if (isAdmin()) {
      m.read = true;
      if (!m.readAt) m.readAt = nowStr();
    } else if (isTeacher()) {
      var t = currentTeacher();
      if (t) {
        m.readBy["teacher:" + t.id] = nowStr();
        m.read = true;
        if (!m.readAt) m.readAt = nowStr();
        m.deliveryStatus = "read";
      }
    } else {
      var p = currentParent();
      if (p) {
        m.readBy[p.id] = nowStr();
        // Pour message non-groupé, aussi flag global (compat)
        if (!m.group) {
          m.read = true;
          if (!m.readAt) m.readAt = nowStr();
        }
      }
    }
    marked = true;
    markMessageReadOnServer(m);
  });
  if (marked) save();

  var last = msgs[msgs.length - 1];
  var title = "Conversation";
  if (last) {
    if (last.group) title = last.group === "ALL" ? "Message groupé — Tous" : "Classe " + last.group;
    else if (isAdmin() || isTeacher()) {
      var other = last.from === myLabel() ? last.to : last.from;
      title = other || "Conversation";
    } else {
      title = last.from === myLabel() ? (last.to || "Administration") : (last.from || "Administration");
    }
  }

  var threadHtml = msgs.map(function(m){
    var mine = m.from === myLabel();
    var cls = mine ? "message sent" : "message received";
    var attachHtml = "";
    if (m.attach) {
      var hasData = !!m.attach.data;
      attachHtml = '<div class="attach-chip">📎 ' + esc(m.attach.name) + ' (' + esc(m.attach.size) + ')'
        + (hasData
          ? ' <a href="#" onclick="event.preventDefault();previewAttachByMsgId(' + m.id + ')">Ouvrir</a>'
            + ' · <a href="#" onclick="event.preventDefault();downloadAttachByMsgId(' + m.id + ')">Télécharger</a>'
          : ' <span class="muted">(contenu non disponible)</span>')
        + '</div>';
    }
    var readHtml = "";
    if (mine && !m.group) {
      // Accusé de lecture pour l'expéditeur (admin, enseignant ou parent)
      var isRead = !!m.read || (m.readBy && Object.keys(m.readBy).length > 0);
      var readAtLabel = m.readAt || "";
      if (!readAtLabel && m.readBy) {
        var keys = Object.keys(m.readBy);
        if (keys.length) readAtLabel = m.readBy[keys[0]];
      }
      if (isAdmin() || isTeacher()) {
        if (isRead && readAtLabel) {
          readHtml = '<div class="read-status lu">✓ Lu le ' + esc(readAtLabel) + '</div>';
        } else if (isRead) {
          readHtml = '<div class="read-status lu">✓ Lu</div>';
        } else {
          readHtml = '<div class="read-status nonlu">○ Non lu</div>';
        }
      } else {
        // Parent : voit si l'administration (ou enseignant) a lu
        if (isRead && readAtLabel) {
          readHtml = '<div class="read-status lu">✓ Lu le ' + esc(readAtLabel) + '</div>';
        } else if (isRead) {
          readHtml = '<div class="read-status lu">✓ Lu</div>';
        } else {
          readHtml = '<div class="read-status nonlu">○ En attente de lecture</div>';
        }
      }
    }
    return '<div class="' + cls + '">'
      + '<div class="msg-meta">' + esc(m.from) + ' · ' + esc(m.date)
      + (m.subject ? ' · <b>' + esc(m.subject) + '</b>' : '')
      + ' · ' + messageDeliveryBadge(m)
      + '</div>'
      + esc(m.body).replace(/\n/g, "<br>")
      + attachHtml
      + readHtml
      + '<div style="margin-top:8px"><button class="btn secondary" onclick="moveMessageToTrash(' + m.id + ')">🗑 Supprimer</button></div>'
      + '</div>';
  }).join("") || empty();

  // Pour répondre : on prend le parentId / destinataire du dernier message pertinent
  var replyParentId = null;
  var replyToName = "Administration";
  if ((isAdmin() || isTeacher()) && last) {
    replyParentId = last.parentId;
    if (!replyParentId) {
      var par = (state.parents || []).find(function(p){ return p.name === last.to || p.name === last.from; });
      if (par) replyParentId = par.id;
    }
    if (last.to === myLabel()) {
      replyToName = last.from;
    } else {
      replyToName = last.from === myLabel() ? last.to : (last.from === "Administration" ? last.to : last.from);
    }
    if (replyToName === myLabel()) replyToName = last.to !== myLabel() ? last.to : "Administration";
  }

  var canReply = !last || !last.group; // pas de réponse directe sur un groupé (utiliser compose)
  var replyBtn = canReply
    ? '<button class="btn primary" onclick="replyInConv(\'' + key.replace(/'/g, "\\'") + '\', ' + (replyParentId || "null") + ', \'' + (replyToName || "").replace(/'/g, "\\'") + '\')">Répondre</button>'
    : '<p class="muted">Pour répondre à un message groupé, utilisez « Nouveau message » vers un parent précis.</p>';

  var exportBtns = '<button class="btn secondary" onclick="exportConversation(\'' + key.replace(/'/g, "\\'") + '\')">⬇ Export TXT</button>'
    + ' <button class="btn secondary" onclick="exportConversationHTML(\'' + key.replace(/'/g, "\\'") + '\')">⬇ Export HTML</button>';

  document.querySelector(".content").innerHTML = '<div class="panel">'
    + '<div class="panel-head">'
    + '<div><h2>' + esc(title) + '</h2>'
    + '<p class="muted">' + msgs.length + ' message' + (msgs.length > 1 ? "s" : "") + '</p></div>'
    + '<div>'
    + exportBtns
    + ' <button class="btn secondary" onclick="go(\'messages\')">Retour</button></div></div>'
    + '<div style="max-height:55vh;overflow-y:auto;padding:8px 0">' + threadHtml + '</div>'
    + '<div class="panel" style="margin-top:10px;background:#f8fafc;border:1px solid #e5e7eb">'
    + '<h3 style="margin-top:0">📍 Suivi de lecture</h3>'
    + '<p class="muted" style="margin-bottom:8px">Pour les messages envoyés, le statut évolue de <b>Envoyé</b> à <b>Distribué</b>, puis <b>Lu</b> lorsque le destinataire ouvre le message. Les dates sont conservées dans l’historique.</p>'
    + (msgs.filter(function(x){return x.from===myLabel() && !x.group;}).slice(-3).reverse().map(function(x){
        return '<div style="padding:8px 0;border-top:1px solid #e5e7eb"><b>'+esc(x.subject||"Sans objet")+'</b><div class="muted">'+esc(x.to||"Administration")+' · '+messageDeliveryLabel(x)+'</div>'
          +(x.sentAt?'<div class="muted">Envoyé : '+esc(x.sentAt)+'</div>': '')
          +(x.deliveredAt?'<div class="muted">Distribué : '+esc(x.deliveredAt)+'</div>': '')
          +(x.readAt?'<div class="muted">Lu : '+esc(x.readAt)+'</div>': '')
          +'</div>';
      }).join("") || '<div class="muted">Aucun message envoyé dans cette conversation.</div>')
    + '</div>'
    + replyBtn

}

function replyInConv(key, parentId, toName){
  var msgs=visibleMessages().filter(function(m){return convKey(m)===key;}).sort(function(a,b){return (a.id||0)-(b.id||0);});
  var last=msgs[msgs.length-1]||{};
  var targetId=null,targetRole=null,targetName=toName||"Administration";
  if(isAdmin()){
    if(last.recipientRole && last.recipientId){targetRole=last.recipientRole;targetId=Number(last.recipientId);}
    else if(last.senderRole && last.senderRole!=="admin" && last.senderId){targetRole=last.senderRole;targetId=Number(last.senderId);}
    else if(parentId){targetRole="parent";targetId=Number(parentId);}
    if(targetRole==="parent"){var p=(state.parents||[]).find(function(x){return Number(x.id)===targetId;});if(p)targetName=p.name;}
    if(targetRole==="teacher"){var t=(state.teachers||[]).find(function(x){return Number(x.id)===targetId;});if(t)targetName=t.name;}
  }
  var kjs=JSON.stringify(key), njs=JSON.stringify(targetName||"Administration"), rjs=JSON.stringify(targetRole||"admin"), ijs=targetId?String(targetId):"null";
  document.querySelector(".content").innerHTML='<div class="panel">'
    +'<div class="panel-head"><div><h2>Répondre</h2><p class="muted">À : '+esc(isAdmin()?targetName:"Administration")+'</p></div><button class="btn secondary" onclick="openConversation('+kjs+')">Retour</button></div>'
    +'<div class="field"><label>Objet</label><input id="sub" value="Re: '+esc(last.subject||"Conversation")+'"></div>'
    +'<div class="field"><label>Message</label><textarea id="body" placeholder="Votre réponse..."></textarea></div>'
    +'<div class="field"><label>Pièce jointe (facultatif, max 2 Mo)</label><input id="attach" type="file"></div>'
    +'<button class="btn primary" onclick="sendReplyInConv('+kjs+','+ijs+','+rjs+','+njs+')">Envoyer</button>'
    +' <button class="btn secondary" onclick="openConversation('+kjs+')">Annuler</button></div>';
}

function sendReplyInConv(key,targetId,targetRole,toName){
  if(!requireSession())return;
  var sub=((document.getElementById("sub")||{}).value||"").trim();
  var body=((document.getElementById("body")||{}).value||"").trim();
  if(!body)return toast("Écrivez une réponse");
  if(!sub)sub="Re: Conversation";
  var senderRole=isAdmin()?"admin":(isTeacher()?"teacher":"parent");
  var senderId=isAdmin()?"admin":(isTeacher()?currentTeacher().id:currentParent().id);
  var recipientRole=isAdmin()?(targetRole||"parent"):"admin";
  var recipientId=isAdmin()?(targetId?Number(targetId):null):null;
  var toLabel=isAdmin()?(toName||"Parent"):"Administration";
  var parentId=recipientRole==="parent"?recipientId:(senderRole==="parent"?Number(senderId):null);
  readAttachment(document.getElementById("attach")).then(function(attach){
    var msg={id:Date.now(),from:myLabel(),to:toLabel,subject:sub,body:body,date:nowStr(),read:false,readBy:{},attach:attach,parentId:parentId,recipientId:recipientId,recipientRole:recipientRole,senderId:senderId,senderRole:senderRole,group:null,deliveryStatus:"queued",sentAt:null,replyToKey:key};
    state.messages.push(msg);logActivity("Réponse envoyée",sub+" → "+toLabel);pushNotif("Nouveau message : "+sub+" — "+toLabel,"message","message",msg.id);save(false);
    publishMessageToServer(msg).then(function(ok){if(ok){msg.sentAt=nowStr();save(false);}});
    toast("Réponse envoyée");openConversation(key);
  });
}

function formatSize(bytes){
  if (bytes < 1024) return bytes + " o";
  if (bytes < 1048576) return (bytes/1024).toFixed(1) + " Ko";
  return (bytes/1048576).toFixed(1) + " Mo";
}

/** Lit le fichier sélectionné et retourne une Promise { name, size, type, data } (data = dataURL base64) */
function readAttachment(input){
  return new Promise(function(resolve){
    var f = input && input.files && input.files[0];
    if (!f) return resolve(null);
    // Limite ~2 Mo pour rester dans localStorage
    if (f.size > 2 * 1024 * 1024) {
      toast("Fichier trop volumineux (max 2 Mo)");
      return resolve(null);
    }
    var reader = new FileReader();
    reader.onload = function(){
      resolve({
        name: f.name,
        size: formatSize(f.size),
        type: f.type || "application/octet-stream",
        data: reader.result  // data:mime;base64,...
      });
    };
    reader.onerror = function(){
      toast("Erreur de lecture du fichier");
      resolve(null);
    };
    reader.readAsDataURL(f);
  });
}

}

function formatVoiceSize(bytes){ return formatSize(bytes); }

function startVoiceRecording(){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder){
    return toast("L'enregistrement vocal n'est pas pris en charge par ce téléphone/navigateur");
  }
  if(window._gescoRecorder){ return toast("Un enregistrement est déjà en cours"); }
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
    var chunks=[];
    var mime="audio/webm";
    try{
      var candidates=["audio/webm;codecs=opus","audio/mp4","audio/webm","audio/ogg;codecs=opus"];
      for(var i=0;i<candidates.length;i++){ if(MediaRecorder.isTypeSupported(candidates[i])){mime=candidates[i];break;} }
    }catch(e){}
    var rec=new MediaRecorder(stream,{mimeType:mime});
    window._gescoRecorder={rec:rec,stream:stream,chunks:chunks,start:Date.now()};
    var btn=document.getElementById("voiceBtn"), status=document.getElementById("voiceStatus");
    if(btn){btn.textContent="⏹ Arrêter";btn.onclick=stopVoiceRecording;}
    if(status) status.textContent="🔴 Enregistrement… 0 s";
    window._gescoVoiceTimer=setInterval(function(){
      var sec=Math.floor((Date.now()-window._gescoRecorder.start)/1000);
      if(status) status.textContent="🔴 Enregistrement… "+sec+" s";
      if(sec>=120) stopVoiceRecording();
    },500);
    rec.ondataavailable=function(e){if(e.data && e.data.size) chunks.push(e.data);};
    rec.onstop=function(){
      clearInterval(window._gescoVoiceTimer); window._gescoVoiceTimer=null;
      stream.getTracks().forEach(function(t){t.stop();});
      var blob=new Blob(chunks,{type:mime});
      window._gescoRecorder=null;
      if(blob.size>2*1024*1024){
        window._gescoVoiceAttachment=null;
        if(status) status.textContent="Enregistrement trop volumineux (max 2 Mo)";
        return toast("Message vocal trop volumineux (max 2 Mo)");
      }
      var reader=new FileReader();
      reader.onload=function(){
        var ext=/mp4/i.test(mime)?"m4a":(/ogg/i.test(mime)?"ogg":"webm");
        window._gescoVoiceAttachment={name:"message-vocal-"+Date.now()+"."+ext,size:formatVoiceSize(blob.size),type:mime,data:reader.result,duration:Math.round((Date.now()-window._gescoVoiceStart)/1000)||0};
        renderVoicePreview();
      };
      reader.readAsDataURL(blob);
    };
    window._gescoVoiceStart=Date.now();
    rec.start();
  }).catch(function(){ toast("Autorisez le microphone pour enregistrer un message vocal"); });
}
function stopVoiceRecording(){
  var r=window._gescoRecorder;
  if(r && r.rec && r.rec.state!=="inactive") r.rec.stop();
  var btn=document.getElementById("voiceBtn"), status=document.getElementById("voiceStatus");
  if(btn){btn.textContent="🎙 Enregistrer";btn.onclick=startVoiceRecording;}
  if(status) status.textContent="Préparation du message vocal…";
}
function clearVoiceRecording(){ window._gescoVoiceAttachment=null; renderVoicePreview(); }
function renderVoicePreview(){
  var box=document.getElementById("voicePreview"); if(!box)return;
  var v=window._gescoVoiceAttachment;
  box.innerHTML=v ? '<div class="voice-chip">🎙 <span>'+esc(v.name)+' ('+esc(v.size)+')</span><audio class="voice-player" controls src="'+v.data+'"></audio><button type="button" class="btn secondary" onclick="clearVoiceRecording()">Supprimer</button></div>' : '';
  var st=document.getElementById("voiceStatus"); if(st && !v) st.textContent="Aucun message vocal";
}
