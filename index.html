function sendManualSMS(){
  var target = document.getElementById("smsTarget").value;
  var text = document.getElementById("smsText").value.trim();
  if (!text) return toast("Saisissez un message");
  if (!smsEnabled()) return toast("Activez d'abord les SMS dans les paramètres");
  var n = 0;
  if (target === "ALL") {
    n = smsToAllParents(text, { type: "manual" });
  } else if (target.indexOf("class:") === 0) {
    n = smsToClass(target.slice(6), text, { type: "manual" });
  } else if (target.indexOf("parent:") === 0) {
    var pid = Number(target.slice(7));
    var p = (state.parents || []).find(function(x){ return x.id === pid; });
    if (p && smsToParent(p, text, { type: "manual" })) n = 1;
  }
  save();
  toast(n + " SMS simulé(s) envoyé(s)");
  go("sms");
}

function sendManualWA(){
  var target = document.getElementById("smsTarget").value;
  var text = document.getElementById("smsText").value.trim();
  if (!text) return toast("Saisissez un message");
  if (!waEnabled()) return toast("Activez d'abord WhatsApp dans les paramètres");
  var n = 0;
  var singleOpen = false;
  if (target === "ALL") {
    n = waToAllParents(text, { type: "manual" });
  } else if (target.indexOf("class:") === 0) {
    n = waToClass(target.slice(6), text, { type: "manual" });
  } else if (target.indexOf("parent:") === 0) {
    var pid = Number(target.slice(7));
    var p = (state.parents || []).find(function(x){ return x.id === pid; });
    if (p && waToParent(p, text, { type: "manual", single: true }, true)) { n = 1; singleOpen = true; }
  }
  save();
  if (n === 0) toast("Aucun destinataire");
  else if (singleOpen) toast("WhatsApp ouvert pour 1 parent");
  else toast(n + " lien(s) WhatsApp généré(s) — voir le journal pour ouvrir");
  go("sms");
}

function togglePrincipalFields(){
  var cb=document.getElementById("tIsPrincipal"), wrap=document.getElementById("tPrincipalWrap");
  if(wrap) wrap.style.display=cb && cb.checked ? "block" : "none";
}

function collectChecked(cls){
  var nodes = document.querySelectorAll("." + cls + ":checked");
  var arr = [];
  for (var i = 0; i < nodes.length; i++) arr.push(nodes[i].value);
  return arr;
}

function saveTeacher(){
  var name = document.getElementById("tName").value.trim();
  var email = document.getElementById("tEmail").value.trim();
  var phone = document.getElementById("tPhone").value.trim();
  var password = document.getElementById("tPass").value || "1234";
  var subjects = collectChecked("t-sub");
  var classes = collectChecked("t-cls");
  var isPrincipal = !!(document.getElementById("tIsPrincipal") && document.getElementById("tIsPrincipal").checked);
  var principalClass = isPrincipal && document.getElementById("tPrincipalClass") ? document.getElementById("tPrincipalClass").value : "";
  if (isPrincipal && !principalClass) return toast("Choisissez la classe unique dont le professeur sera titulaire");
  if (isPrincipal && (state.teachers || []).some(function(x){ return x.isPrincipal && x.principalClass === principalClass; })) return toast("Cette classe a déjà un professeur principal");
  if (isPrincipal && classes.indexOf(principalClass) === -1) classes.push(principalClass);
  if (!name) return toast("Nom obligatoire");
  if (!subjects.length) return toast("Choisissez au moins une matière");
  hashPassword(password || "1234").then(function(h){
    state.teachers.push({
      id: Date.now(), active: true, name: name, email: email, phone: phone, password: h,
      subjects: subjects, classes: classes, isPrincipal: isPrincipal, principalClass: principalClass
    });
    save();
    toast("Enseignant ajouté — connexion : " + name + " / (mot de passe choisi)");
    go("teachers");
  });
}

function updateTeacher(id){
  var t = state.teachers.find(function(x){ return x.id === id; });
  if (!t) return;
  t.name = document.getElementById("tName").value.trim();
  t.email = document.getElementById("tEmail").value.trim();
  t.phone = document.getElementById("tPhone").value.trim();
  var tp = (document.getElementById("tPass").value || "").trim();
  t.subjects = collectChecked("t-sub");
  t.classes = collectChecked("t-cls");
  t.isPrincipal = !!(document.getElementById("tIsPrincipal") && document.getElementById("tIsPrincipal").checked);
  t.principalClass = t.isPrincipal && document.getElementById("tPrincipalClass") ? document.getElementById("tPrincipalClass").value : "";
  if (t.isPrincipal && !t.principalClass) return toast("Choisissez la classe unique dont le professeur sera titulaire");
  if (t.isPrincipal && (state.teachers || []).some(function(x){ return x.id !== id && x.isPrincipal && x.principalClass === t.principalClass; })) return toast("Cette classe a déjà un professeur principal");
  if (t.isPrincipal && t.classes.indexOf(t.principalClass) === -1) t.classes.push(t.principalClass);
  if (!t.name) return toast("Nom obligatoire");
  if (!t.subjects.length) return toast("Au moins une matière");
  function doneT(){ save(); toast("Enseignant mis à jour"); go("teachers"); }
  if (tp) {
    var st = passwordStrength(tp);
    if (!st.ok) return toast(st.label);
    hashPassword(tp).then(function(h){ t.password = h; doneT(); });
  } else { doneT(); }
}

function deleteTeacher(id){
  if (!confirm("Supprimer cet enseignant et ses messages associés ?")) return;
  var t = (state.teachers || []).find(function(x){ return x.id === id; });
  var tname = t ? t.name : null;
  state.teachers = state.teachers.filter(function(x){ return x.id !== id; });
  if (tname) {
    state.messages = (state.messages || []).filter(function(m){
      return m.from !== tname && m.to !== tname;
    });
  }
  // Si l'utilisateur connecté est cet enseignant, déconnecter
  if (typeof state.user === "string" && state.user === "teacher:" + id) {
    state.user = null;
  }
  save();
  toast("Enseignant supprimé");
  go("teachers");
}

async function provisionServerAccount(kind, id){
  if (!isAdmin()) return toast("Accès administrateur requis");
  if (!state.api || !state.api.sessionToken) return toast("Connectez l'administration au serveur avant de créer les comptes");
  var payload = {kind:kind, id:id};
  try {
    var r = await serverRequest("/api/admin/users/provision", {method:"POST", body:JSON.stringify(payload)});
    toast((r && r.created ? "Compte serveur créé" : "Compte serveur synchronisé"));
    return r;
  } catch(e) {
    toast("Impossible de créer le compte serveur : " + (e.message || "erreur"));
    return null;
  }
}
async function provisionAllServerAccounts(){
  if (!isAdmin()) return;
  if (!state.api || !state.api.sessionToken) return toast("Connectez d'abord l'administration au serveur");
  var count = 0;
  for (var i=0;i<(state.teachers||[]).length;i++) {
    if (await provisionServerAccount("teacher", state.teachers[i].id)) count++;
  }
  for (var j=0;j<(state.parents||[]).length;j++) {
    if (await provisionServerAccount("parent", state.parents[j].id)) count++;
  }
  toast(count + " compte(s) traité(s) sur le serveur");
}

function conversationKey(kind,id){ return 'admin:'+String(kind)+':'+String(id); }
function openGroupComposer(){
  if(!state.user || state.user.role!=='admin'){ alert('Accès réservé à l’administration.'); return; }
  state.page='groupCompose'; render();
}
function groupParticipants(groupId){
  var map={};
  (state.messages||[]).filter(function(m){return m.groupId===groupId;}).forEach(function(m){
    if(m.senderRole && m.senderId!=null){
      var sk=m.senderRole+":"+m.senderId;
      map[sk]={role:m.senderRole,id:Number(m.senderId),name:m.from||((m.senderRole==='admin')?'Administration':'Utilisateur')};
    }
    if(m.recipientRole && m.recipientId!=null){
      var rk=m.recipientRole+":"+m.recipientId;
      map[rk]={role:m.recipientRole,id:Number(m.recipientId),name:m.to||'Utilisateur'};
    }
  });
  return Object.keys(map).map(function(k){return map[k];});
}
function isGroupParticipant(groupId){
  var u=state.user||{};
  var role=u.role||''; var id=role==='admin'?'admin':Number(u.id);
  return groupParticipants(groupId).some(function(p){return p.role===role && String(p.id)===String(id);});
}
function groupMessageLogicalList(groupId){
  var seen={}, out=[];
  (state.messages||[]).filter(function(m){return m.groupId===groupId;}).forEach(function(m){
    var key=m.groupMessageId||m.id;
    if(seen[key]) return;
    seen[key]=true; out.push(m);
  });
  out.sort(function(a,b){return new Date(a.date||0)-new Date(b.date||0);});
  return out;
}
function groupCurrentUserKey(){
  var u=state.user||{};
  return (u.role||'')+':'+String(u.role==='admin'?'admin':u.id);
}
function markGroupRead(groupId){
  if(!isGroupParticipant(groupId)) return;
  var key=groupCurrentUserKey(), stamp=nowStr(), changed=false;
  (state.messages||[]).filter(function(m){return m.groupId===groupId && m.recipientRole===state.user.role && String(m.recipientId)===String(state.user.role==='admin'?'admin':state.user.id);}).forEach(function(m){
    m.readBy=m.readBy||{};
    if(!m.readBy[key]){m.readBy[key]=stamp; changed=true;}
    m.read=true; m.readAt=m.readAt||stamp; m.deliveryStatus='read';
  });
  if(changed) save();
}
function openGroupConversation(groupId){
  if(!groupId || !isGroupParticipant(groupId)) return toast('Accès à ce groupe non autorisé');
  markGroupRead(groupId);
  var msgs=groupMessageLogicalList(groupId);
  if(!msgs.length) return toast('Groupe introuvable');
  var participants=groupParticipants(groupId);
  var myKey=groupCurrentUserKey();
  var html=msgs.map(function(m){
    var mine=(m.senderRole===state.user.role && String(m.senderId)===String(state.user.role==='admin'?'admin':state.user.id));
    var readCount=participants.filter(function(p){
      var k=p.role+':'+String(p.role==='admin'?'admin':p.id);
      return (m.readBy&&m.readBy[k]);
    }).length;
    var ptxt=(m.readBy&&Object.keys(m.readBy).length)?' · Lu par '+readCount+'/'+Math.max(0,participants.length-1):'';
    return '<div class="message '+(mine?'sent':'received')+'"><div class="msg-meta"><b>'+esc(m.from||'Utilisateur')+'</b> · '+esc(m.date||'')+ptxt+'</div>'+esc(m.body||m.text||'').replace(/\n/g,'<br>')+'</div>';
  }).join('');
  var reply='<div class="field" style="margin-top:12px"><label>Répondre au groupe</label><textarea id="groupReplyText" rows="4" placeholder="Votre réponse sera visible par tous les participants."></textarea></div>'
    +'<button class="btn primary" onclick="sendGroupReply('+JSON.stringify(groupId)+')">Envoyer la réponse</button>';
  document.querySelector('.content').innerHTML='<div class="panel"><div class="panel-head"><div><h2>👥 Conversation de groupe</h2><p class="muted">'+participants.length+' participant(s)</p></div><button class="btn secondary" onclick="go(\'messages\')">Retour</button></div>'
    +'<div style="max-height:55vh;overflow-y:auto;padding:8px 0">'+html+'</div>'+reply+'</div>';
}
function sendGroupReply(groupId){
  if(!requireSession() || !isGroupParticipant(groupId)) return;
  var text=((document.getElementById('groupReplyText')||{}).value||'').trim();
  if(!text) return toast('Écrivez une réponse');
  var senderRole=state.user.role, senderId=senderRole==='admin'?'admin':Number(state.user.id), senderName=myLabel();
  var participants=groupParticipants(groupId).filter(function(p){return !(p.role===senderRole && String(p.id)===String(senderId));});
  if(!participants.length) return toast('Aucun autre participant');
  var logicalId='GM'+Date.now(), date=new Date().toISOString();
  state.messages=state.messages||[];
  participants.forEach(function(r){
    var id=logicalId+'_'+r.role+'_'+r.id;
    state.messages.push({id:id,group:groupId,groupId:groupId,groupMessageId:logicalId,threadKey:'group:'+groupId,from:senderName,to:r.name,subject:'Conversation de groupe',body:text,date:date,read:false,readBy:{},recipientId:r.id,recipientRole:r.role,senderId:senderId,senderRole:senderRole,deliveryStatus:'queued',sentAt:null});
    pushNotif('Réponse dans un groupe : '+text.slice(0,100),'message','message',id);
  });
  state.syncQueue=state.syncQueue||[]; state.syncQueue.push({type:'group-reply',groupId:groupId,messageId:logicalId,count:participants.length,date:date});
  save(); toast('Réponse envoyée à '+participants.length+' participant(s)'); openGroupConversation(groupId);
}

function saveGroupConversation(){
  if(!state.user || state.user.role!=='admin') return;
  var checks=[].slice.call(document.querySelectorAll('input[name="groupRecipient"]:checked'));
  if(!checks.length){ alert('Sélectionnez au moins un destinataire.'); return; }
  var text=(document.getElementById('groupMessageText')||{}).value||'';
  if(!text.trim()){ alert('Saisissez un message.'); return; }
  var groupId='G'+Date.now(), logicalId='GM'+Date.now(), date=new Date().toISOString();
  var recipients=checks.map(function(c){ var a=c.value.split(':'); return {kind:a[0],id:Number(a[1])}; });
  state.messages=state.messages||[];
  recipients.forEach(function(r){
    var u=r.kind==='parent'?(state.parents||[]).find(function(x){return x.id===r.id;}):(state.teachers||[]).find(function(x){return x.id===r.id;});
    if(!u || u.active===false) return;
    var id=logicalId+'_'+r.kind+'_'+r.id;
    state.messages.push({id:id,group:groupId,groupId:groupId,groupMessageId:logicalId,threadKey:'group:'+groupId,from:myLabel(),to:u.name,subject:'Message groupé',body:text.trim(),date:date,read:false,readBy:{},recipientId:r.id,recipientRole:r.kind,senderId:'admin',senderRole:'admin',deliveryStatus:'queued',sentAt:null});

/* ===== 2.3.112 — PDF des bulletins : stockés sur le serveur quand il est connecté ===== */
function ppServerFilesOn(){ return !!(state.api && state.api.enabled && state.api.baseUrl && state.api.sessionToken); }
function ppReadDataUrl(file){ return new Promise(function(res, rej){ var r = new FileReader(); r.onload = function(){ res(String(r.result || "")); }; r.onerror = function(){ rej(new Error("Lecture du PDF impossible. Réessayez.")); }; r.readAsDataURL(file); }); }
async function ppStoreBulletinFile(file){
  var online = ppServerFilesOn(), max = online ? 10 * 1024 * 1024 : 1.8 * 1024 * 1024;
  if (file.size > max) throw new Error("PDF trop volumineux : maximum " + (online ? "10" : "1,8") + " Mo");
  var data = await ppReadDataUrl(file);
  if (!data) throw new Error("Le PDF n’a pas pu être lu");
  if (online) { var r = await apiRequest("/api/files", { method: "POST", body: JSON.stringify({ name: file.name, data: data }) }); return { fileId: r.id, data: "", size: r.size }; }
  return { fileId: null, data: data, size: file.size };
}
async function ppBulletinHref(b){
  if (b.data) return { href: b.data };
  if (!b.fileId) throw new Error("Bulletin indisponible");
  var resp = await fetch(apiUrl("/api/files/" + b.fileId), { headers: { Authorization: "Bearer " + (state.api && state.api.sessionToken || "") } });
  if (!resp.ok) throw new Error(resp.status === 404 ? "Bulletin introuvable ou accès refusé" : resp.status === 401 ? "Session expirée : reconnectez-vous" : "Téléchargement impossible (" + resp.status + ")");
  return { href: URL.createObjectURL(await resp.blob()), revoke: true };
}
async function ppDownloadBulletinFile(b, filename){
  try {
    toast("Téléchargement en cours…");
    var h = await ppBulletinHref(b), a = document.createElement("a");
    a.href = h.href; a.download = String(filename || b.name || "Bulletin.pdf").replace(/[\\/:*?"<>|]/g, "_");
    document.body.appendChild(a); a.click(); a.remove();
    if (h.revoke) setTimeout(function(){ URL.revokeObjectURL(h.href); }, 5000);
  } catch (e) { toast(e.message || "Téléchargement impossible"); }
}

function changePassword(){
  // Parents : le mot de passe est toujours le numéro de téléphone
  if (currentParent()) {
    toast("Pour les parents, le mot de passe est le n° de téléphone. Modifiez le téléphone dans le profil.");
    return;
  }
  let oldP = document.getElementById("oldPass").value;
  let newP = document.getElementById("newPass").value;
  let confirmP = document.getElementById("newPass2") ? document.getElementById("newPass2").value : newP;
  if (newP !== confirmP) return toast("Les mots de passe ne correspondent pas");
  var st = passwordStrength(newP);
  if (!st.ok) return toast(st.label);

  var userVal = state.user;
  var stored = getAccountPassword(userVal);
  verifyPassword(oldP, stored).then(function(ok){
    if (!ok) return toast("Mot de passe actuel incorrect");
    hashPassword(newP).then(function(h){
      setAccountPassword(userVal, h);
      save();
      toast("Mot de passe modifié (sécurisé)");
      if (state.api && state.api.sessionToken) {
        serverRequest("/api/auth/password", { method:"POST", body:JSON.stringify({ currentPassword: oldP, newPassword: newP }) })
          .catch(function(e){ toast("Modifié sur ce téléphone mais pas sur le serveur : " + (e.message || "erreur")); });
      }
      document.getElementById("oldPass").value = "";
      document.getElementById("newPass").value = "";
      if (document.getElementById("newPass2")) document.getElementById("newPass2").value = "";
    });
  });
}

/* ========== COMPATIBILITÉ ET RÉPARATION SANS EFFACEMENT ========== */
function normalizePortalState(){
  if (!state || typeof state !== "object" || Array.isArray(state)) state = defaultState();
  var d = defaultState();
  ["messages","notifications","parents","teachers","annonces","events","activityLog","recoveryRequests","smsLog","whatsappLog","templates","classes","students","bulletins","bulletinRequests","bulletinHistory","attachments","apiLogs"].forEach(function(k){
    if (!Array.isArray(state[k])) state[k] = Array.isArray(d[k]) ? d[k] : [];
  });
  if (!state.profiles || typeof state.profiles !== "object") state.profiles = d.profiles || {admin:{name:"Administration"}};
  if (!state.profiles.admin || typeof state.profiles.admin !== "object") state.profiles.admin = (d.profiles && d.profiles.admin) || {name:"Administration"};
  if (!state.api || typeof state.api !== "object") state.api = Object.assign({}, d.api || {});
  if (!state.supervisor || typeof state.supervisor !== "object") state.supervisor = d.supervisor || {id:1,name:"Surveillant général",active:true};
  if (!state.bloc3 || typeof state.bloc3 !== "object") state.bloc3 = {};
  ["drafts","deleted","readReceipts","labels","pinned"].forEach(function(k){ if(!Array.isArray(state.bloc3[k])) state.bloc3[k]=[]; });
  if (!state.bloc3.prefs || typeof state.bloc3.prefs !== "object") state.bloc3.prefs={compact:false,onlyUnread:false};
  if (!state.bloc2 || typeof state.bloc2 !== "object") state.bloc2 = {};
  if (!state.smsSettings || typeof state.smsSettings !== "object") state.smsSettings = Object.assign({}, d.smsSettings || {});
  if (!state.whatsappSettings || typeof state.whatsappSettings !== "object") state.whatsappSettings = Object.assign({}, d.whatsappSettings || {});
  return state;
}

/* PORTAIL PARENTS — correctifs métier V2.3.78 */
(function(){
  'use strict';
  window.GESCO_VERSION='2.3.112';
  document.title='Portail Parents — CST Manjo';
  var oldView=view;
  canAccessPage=function(p){
    if(isAdmin()) return true;

    if(p==='classes'||p==='teachers'||p==='parents'||p==='activity'||p==='sms'||p==='controle'||p==='bloc2') return false;

    return ['home','communication','messages','annonces','events','notifications','suivi','profil','search','bloc3','bulletins'].indexOf(p)!==-1;
  };
  function escx(x){return typeof esc==='function'?esc(String(x==null?'':x)):String(x||'').replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function myClasses(){
    if(isAdmin()) return (state.classes||[]).slice();
    if(isTeacher()){var t=currentTeacher();return t?(t.classes||[]):[]}
    var p=currentParent();return p?(p.children||[]).map(function(c){return typeof c==='string'?c:c.className}).filter(Boolean):[];
  }
  function bulletinView(){

    return '<h2>Bulletins séquentiels</h2><p class="muted">L’administration importe les bulletins dès leur disponibilité. Les parents téléchargent uniquement ceux des classes de leurs enfants.</p>'+
    (admin?'<div class="panel"><h3>Importer un bulletin</h3><div class="field"><label>Classe</label><select id="bpClass">'+(state.classes||[]).map(function(c){return '<option>'+escx(c)+'</option>'}).join('')+'</select></div><div class="field"><label>Séquence</label><select id="bpSeq"><option>Séquence 1</option><option>Séquence 2</option><option>Séquence 3</option><option>Trimestre 1</option><option>Trimestre 2</option><option>Trimestre 3</option></select></div><div class="field"><label>Fichier PDF du bulletin</label><input id="bpFile" type="file" accept=".pdf,application/pdf"></div><button class="btn primary" onclick="portalImportBulletin()">Importer et publier</button></div>':'')+
    '<div class="panel"><h3>Bulletins disponibles</h3>'+(list.length?list.map(function(b){return '<div class="item"><b>'+escx(b.sequence||'Bulletin séquentiel')+' — '+escx(b.className)+'</b><p class="muted">'+escx(b.name||'Bulletin PDF')+' · '+escx(b.date||'')+'</p>'+(b.data?'<button class="btn secondary" onclick="portalDownloadBulletin('+Number(b.id)+')">Télécharger le PDF</button>':'<span class="muted">Bulletin enregistré sans fichier joint.</span>')+'</div>'}).join(''):'<div class="empty">Aucun bulletin disponible pour vos classes.</div>')+'</div>';
  }
  window.portalImportBulletin=function(){
    if(!isAdmin())return toast('Import réservé à l’administrateur');
    var f=(document.getElementById('bpFile')||{}).files;
    if(!f||!f[0])return toast('Choisissez un fichier PDF');
    var file=f[0]; if(file.type!=='application/pdf'&&!/\.pdf$/i.test(file.name))return toast('Le fichier doit être un PDF');
    if(file.size>3*1024*1024)return toast('PDF trop volumineux (maximum 3 Mo)');
    var r=new FileReader();r.onload=function(){
      state.bulletins=Array.isArray(state.bulletins)?state.bulletins:[];
      state.bulletins.push({id:Date.now(),className:document.getElementById('bpClass').value,sequence:document.getElementById('bpSeq').value,name:file.name,data:r.result,date:new Date().toLocaleDateString('fr-FR'),type:'sequentiel',available:true});
      save();render();toast('Bulletin publié pour les parents de la classe');
    };r.onerror=function(){toast('Lecture du PDF impossible')};r.readAsDataURL(file);
  };
  window.portalDownloadBulletin=function(id){
    var b=(state.bulletins||[]).find(function(x){return Number(x.id)===Number(id)}); if(!b||!b.data)return toast('Fichier indisponible');

  };
  function classPrincipalView(){
    if(!isAdmin())return '<h2>Classes</h2><p class="muted">Affectation réservée à l’administration.</p>';
    var cls=state.classes||[], ts=state.teachers||[];
    state.classPrincipals=state.classPrincipals||{};
    /* Reprendre les affectations déjà enregistrées dans les fiches enseignants. */
    ts.forEach(function(t){if(t&&t.isPrincipal&&t.principalClass&&!state.classPrincipals[t.principalClass])state.classPrincipals[t.principalClass]=Number(t.id);});

    }).join('')+'</div><div class="panel"><h3>Règles de communication</h3><ul><li>Les communications générales sont publiées par l’administrateur.</li><li>Le professeur principal communique avec les parents des élèves de sa classe.</li><li>Le surveillant général gère absences, retards et discipline.</li><li>Un parent ne doit voir que les données liées aux classes de ses enfants.</li></ul></div>';
  }
  window.portalSetPrincipal=function(c,i){
    if(!isAdmin())return toast('Accès administrateur requis');
    var field=document.getElementById('principal_'+i);if(!field)return toast('Champ d’affectation introuvable');
    var v=field.value;
    state.classPrincipals=state.classPrincipals||{};
    if(v){
      var conflict=Object.keys(state.classPrincipals).some(function(k){return k!==c&&String(state.classPrincipals[k])===String(v);});
      var teacher=(state.teachers||[]).find(function(t){return String(t.id)===String(v);});

      if(oldTeacher&&oldTeacher.principalClass===c){oldTeacher.isPrincipal=false;oldTeacher.principalClass='';}

  };
  view=function(){

  var oldShell=shell;

    if(isAdmin())h=h.replace('<button data-page="classes"', '<button data-page="affectations" class="'+(page==="affectations"?"active":"")+'" onclick="go(&#39;affectations&#39;)" aria-label="Professeurs principaux">Profs principaux</button><button data-page="classes"');
    return h;
  };
  /* Les enseignants ne saisissent pas de notes dans ce portail de communication. */
  var oldSuivi=suiviView;
  suiviView=function(){
    if(isTeacher())return '<h2>Suivi scolaire</h2><div class="panel"><p>La saisie des notes est désactivée dans Portail Parents. Les enseignants utilisent cet espace pour la communication liée à leurs classes affectées.</p></div>';
    return oldSuivi();
  };
  /* Initialise les nouvelles structures sans effacer les données existantes. */
  state.classPrincipals=state.classPrincipals||{};
  state.bulletins=Array.isArray(state.bulletins)?state.bulletins:[];
  try{save(false)}catch(e){}
  try{render()}catch(e){console.error('Portail Parents',e)}
})();

</script>

 }
 var priorView=window.bulletinView;
 if(typeof priorView==='function')window.bulletinView=function(){
   var html=priorView();
   try{
     var q=ensureQueue().slice().reverse();
     var pending=q.filter(function(x){return x.status==='pending';}).length;
     var admin=typeof isAdmin==='function'&&isAdmin();

       q=q.filter(function(x){if(p)return String(x.parentId||'')===String(p.id);if(t)return String(x.teacherId||'')===String(t.id);return false;});}
     q=q.slice(0,15);
     html+='<div class="panel" style="margin-top:12px"><h3>File d’attente des bulletins</h3><p class="muted">Opérations en attente de synchronisation centrale : <b>'+pending+'</b></p>'+
       (q.length?q.map(function(x){var label=x.status==='synced'?'Synchronisée':'En attente';return '<div class="item"><b>'+label+' — '+(typeof esc==='function'?esc(x.type):String(x.type))+'</b><p>'+(typeof esc==='function'?esc(x.className):String(x.className))+' — '+(typeof esc==='function'?esc(x.sequence):String(x.sequence))+'</p><small class="muted">'+(typeof esc==='function'?esc(x.date):String(x.date))+'</small></div>';}).join(''):'<p class="muted">Aucune opération enregistrée.</p>')+
       (admin?'<button class="btn secondary" onclick="portalSyncBulletins()">Réessayer la synchronisation</button>':'')+'</div>';
   }catch(e){}
   return html;
 };
 try{var title=document.querySelector('title');if(title)title.textContent='Portail Parents — V2.3.112';if(typeof render==='function')render();}catch(e){}
