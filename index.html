/* ========== MESSAGERIE CENTRALISÉE — ÉTAPE 5 ========== */
function messageDeliveryLabel(m){
  var st=m.deliveryStatus||((state.api&&state.api.enabled)?"queued":"local");
  return st==="read"?"✓✓ Lu":st==="delivered"?"✓✓ Distribué":st==="sent"?"✓ Envoyé":st==="queued"?"⏳ En attente":"📱 Local";
}
function messageDeliveryDetail(m){
  var parts=[];
  if(m.sentAt) parts.push("Envoyé : "+m.sentAt);
  if(m.deliveredAt) parts.push("Distribué : "+m.deliveredAt);
  if(m.readAt) parts.push("Lu : "+m.readAt);
  return parts.join("\n");
}
async function publishMessageToServer(msg){
  if(!state.api || !state.api.enabled || !state.api.baseUrl || !state.api.sessionToken){
    msg.deliveryStatus=msg.deliveryStatus||"local";
    return false;
  }
  try{
    var r=await apiRequest("/api/messages",{method:"POST",body:JSON.stringify({schoolId:state.api.schoolId,deviceId:state.api.deviceId,message:msg})});
    if(r&&r.message) Object.assign(msg,r.message);
    var st=(r&&r.status)||"sent";
    msg.deliveryStatus=st==="read"?"read":(st==="delivered"?"delivered":"sent");
    if(!msg.sentAt) msg.sentAt=nowStr();
    if(msg.deliveryStatus==="delivered" && !msg.deliveredAt) msg.deliveredAt=nowStr();
    return true;
  }catch(e){ msg.deliveryStatus="queued"; msg.deliveryError=e.message||"Serveur indisponible"; return false; }
}
async function markMessageReadOnServer(msg){
  if(!state.api || !state.api.enabled || !state.api.baseUrl || !state.api.sessionToken) return;
  try{
    var r=await apiRequest("/api/messages/"+encodeURIComponent(msg.id)+"/read",{method:"POST",body:JSON.stringify({schoolId:state.api.schoolId,deviceId:state.api.deviceId,readAt:msg.readAt||nowStr()})});
    msg.deliveryStatus="read";
    if(!msg.readAt) msg.readAt=nowStr();
    if(!msg.deliveredAt) msg.deliveredAt=msg.readAt;
    if(r&&r.message) Object.assign(msg,r.message);
    save(false);
  }catch(e){}
}
async function retryPendingMessages(){
  if(!state.api || !state.api.enabled) return toast("Serveur central non configuré");
  var pending=(state.messages||[]).filter(function(m){return m.deliveryStatus==="queued";});
  var n=0;
  for(var i=0;i<pending.length;i++) if(await publishMessageToServer(pending[i])) n++;
  if(n) save(false);
  toast(n+" message(s) synchronisé(s)");
}
function messageDeliveryBadge(m){
  var title=messageDeliveryDetail(m);
  if(m.deliveryError) title+=(title?'\n':'')+m.deliveryError;
  return '<span class="badge" title="'+esc(title)+'">'+messageDeliveryLabel(m)+'</span>';
}
/* ========== MESSAGES ========== */
function messages(){
  var admin = isAdmin();
  var list = visibleMessages().slice().reverse();

  // Grouper en conversations
  var convMap = {};
  list.forEach(function(m){
    var key = convKey(m);
    if (!convMap[key]) {
      convMap[key] = {
        key: key,
        messages: [],
        last: m,
        unread: 0,
        title: "",
        subtitle: ""
      };
    }
    convMap[key].messages.push(m);
    if (isMsgUnreadForMe(m)) convMap[key].unread++;
    // garder le plus récent comme last (list est déjà reverse chronologique)
    if (!convMap[key].last || m.id > convMap[key].last.id) convMap[key].last = m;
  });

  var convs = Object.keys(convMap).map(function(k){ return convMap[k]; });
  // trier par date du dernier message
  convs.sort(function(a, b){ return (b.last.id || 0) - (a.last.id || 0); });

  // libellés
  convs.forEach(function(c){
    var m = c.last;
    if (m.group) {
      c.title = m.group === "ALL" ? "Message groupé — Tous les parents" : "Message groupé — Classe " + m.group;
      c.subtitle = "Administration → " + m.to;
    } else if (admin || isTeacher()) {
      var other = m.from === myLabel() ? m.to : m.from;
      c.title = other || "Conversation";
      var par = (state.parents || []).find(function(p){ return p.id === m.parentId || p.name === other; });
      var teach = (state.teachers || []).find(function(t){ return t.id === m.recipientId && m.recipientRole === "teacher" || t.id === m.senderId && m.senderRole === "teacher" || t.name === other; });
      c.subtitle = par
        ? ((par.children && par.children[0] ? par.children[0].name : par.student) + " · " + (par.children && par.children[0] ? par.children[0].className : par.className))
        : (teach ? ("Enseignant · " + (teach.subjects || []).join(", ")) : (m.from + " ↔ " + m.to));
    } else {
      c.title = m.from === myLabel() ? m.to : m.from;
      if (c.title === myLabel()) c.title = "Administration";
      c.subtitle = m.subject || "Conversation";
    }
  });

  var convHtml = convs.map(function(c){
    var m = c.last;
    var preview = (m.body || "").slice(0, 90) + (m.body && m.body.length > 90 ? "…" : "");
    var badge = c.unread ? '<span class="badge badge-new">' + c.unread + ' non lu' + (c.unread > 1 ? "s" : "") + '</span>' : "";
    var groupBadge = m.group ? '<span class="badge">Groupé</span>' : "";
    var meName = myLabel();
    var hasIncoming = c.messages.some(function(x){ return x.from !== meName; });
    var hasOutgoing = c.messages.some(function(x){ return x.from === meName; });
    var flow = hasIncoming && hasOutgoing ? "both" : (hasOutgoing ? "sent" : "received");
    return '<div class="item clickable" data-flow="' + flow + '" onclick="openConversation(\'' + c.key.replace(/'/g, "\\'") + '\')">'
      + '<div class="item-head"><b>' + esc(c.title) + '</b>' + badge + groupBadge + '</div>'
      + '<p class="muted">' + esc(m.date) + ' · ' + esc(c.subtitle) + '</p>'
      + '<div><b>' + esc(m.subject) + '</b> — ' + esc(preview) + '</div>'
      + '</div>';
  }).join("") || empty();

  return '<div class="panel-head">'
    + '<div><h1>Boîte de réception</h1><p class="muted">'
    + (admin ? "Conversations avec les parents et messages groupés." : "Vos échanges avec l'administration.")
    + '</p></div>'
    + '<div>'
    + '<button class="btn primary" onclick="compose()">Nouveau message</button> <button class="btn secondary" onclick="markAllMessagesRead()">✓ Tout marquer lu</button> <button class="btn secondary" onclick="retryPendingMessages()">↻ Synchroniser</button> <button class="btn secondary" onclick="openTrash()">🗑 Corbeille</button>'
    + (admin ? ' <button class="btn secondary" onclick="composeGroup()">Message groupé</button>' : "")
    + '</div></div>'
    + '<div class="panel">'
    + '<div class="grid2" style="margin-bottom:14px">'
    + '<div class="field" style="margin:0"><label>Rechercher</label>'
    + '<input id="msgSearch" oninput="filterConversations()" placeholder="Objet, message ou contact..."></div>'
    + '<div class="field" style="margin:0"><label>Filtre</label>'
    + '<select id="msgFilter" onchange="filterConversations()">'
    + '<option value="all">Toutes les conversations</option>'
    + '<option value="received">Reçues</option>'
    + '<option value="sent">Envoyées</option>'
    + '<option value="unread">Non lues</option>'
    + '</select></div></div>'
    + '<div class="list" id="msgList">' + convHtml + '</div></div>'
    + '<div class="panel" style="margin-top:14px"><div class="panel-head"><div><h2>📝 Brouillons</h2><p class="muted">Messages enregistrés sur ce téléphone.</p></div></div>'
    + (((state.drafts||[]).slice().reverse().map(function(d){return '<div class="item"><div class="item-head"><b>'+esc(draftLabel(d))+'</b><span class="badge">Brouillon</span></div><p class="muted">'+esc(d.date||"")+'</p><div>'+esc((d.body||"").slice(0,100))+'</div><div style="margin-top:8px"><button class="btn secondary" onclick="editDraft('+d.id+')">Modifier</button> <button class="btn secondary" onclick="deleteDraft('+d.id+')">Supprimer</button></div></div>';}).join("")) || empty()) + '</div>';
}

function filterConversations(){
  var q = (document.getElementById("msgSearch") && document.getElementById("msgSearch").value || "").toLowerCase();
  var f = (document.getElementById("msgFilter") && document.getElementById("msgFilter").value) || "all";
  var items = document.querySelectorAll("#msgList .item");
  items.forEach(function(el){
    var text = (el.textContent || "").toLowerCase();
    var okQ = !q || text.indexOf(q) !== -1;
    var flow = el.getAttribute("data-flow") || "received";
    var okF = f === "all" || (f === "unread" && (el.querySelector(".badge-new") || /non lu/i.test(el.textContent || ""))) || (f === "received" && (flow === "received" || flow === "both")) || (f === "sent" && (flow === "sent" || flow === "both"));
    el.style.display = (okQ && okF) ? "" : "none";
  });
}

function openConversation(key){
  if (String(key).indexOf("group:")===0) return openGroupConversation(String(key).slice(6));
  var msgs = visibleMessages().filter(function(m){ return convKey(m) === key; });
  msgs.sort(function(a, b){ return (a.id || 0) - (b.id || 0); });

  // Marquer comme lus les messages destinés à moi (+ accusé de lecture par destinataire)
  var marked = false;
  msgs.forEach(function(m){
    if (!isMsgUnreadForMe(m)) return;
    if (!m.deliveredAt) { m.deliveredAt = nowStr(); if (m.deliveryStatus !== "read") m.deliveryStatus = "delivered"; }
    if (!m.readBy) m.readBy = {};
    if (isAdmin()) {
      m.read = true;
      if (!m.readAt) m.readAt = nowStr();
    } else if (isTeacher()) {
      var t = currentTeacher();
      if (t) {
        m.readBy["teacher:" + t.id] = nowStr();
        m.read = true;
        if (!m.readAt) m.readAt = nowStr();
        m.deliveryStatus = "read";
      }
    } else {
      var p = currentParent();
      if (p) {
        m.readBy[p.id] = nowStr();
        // Pour message non-groupé, aussi flag global (compat)
        if (!m.group) {
          m.read = true;
          if (!m.readAt) m.readAt = nowStr();
        }
      }
    }
    marked = true;
    markMessageReadOnServer(m);
  });
  if (marked) save();

  var last = msgs[msgs.length - 1];
  var title = "Conversation";
  if (last) {
    if (last.group) title = last.group === "ALL" ? "Message groupé — Tous" : "Classe " + last.group;
    else if (isAdmin() || isTeacher()) {
      var other = last.from === myLabel() ? last.to : last.from;
      title = other || "Conversation";
    } else {
      title = last.from === myLabel() ? (last.to || "Administration") : (last.from || "Administration");
    }
  }

  var threadHtml = msgs.map(function(m){
    var mine = m.from === myLabel();
    var cls = mine ? "message sent" : "message received";
    var attachHtml = "";
    if (m.attach) {
      var hasData = !!m.attach.data;
      attachHtml = '<div class="attach-chip">📎 ' + esc(m.attach.name) + ' (' + esc(m.attach.size) + ')'
        + (hasData
          ? ' <a href="#" onclick="event.preventDefault();previewAttachByMsgId(' + m.id + ')">Ouvrir</a>'
            + ' · <a href="#" onclick="event.preventDefault();downloadAttachByMsgId(' + m.id + ')">Télécharger</a>'
          : ' <span class="muted">(contenu non disponible)</span>')
        + '</div>';
    }
    var readHtml = "";
    if (mine && !m.group) {
      // Accusé de lecture pour l'expéditeur (admin, enseignant ou parent)
      var isRead = !!m.read || (m.readBy && Object.keys(m.readBy).length > 0);
      var readAtLabel = m.readAt || "";
      if (!readAtLabel && m.readBy) {
        var keys = Object.keys(m.readBy);
        if (keys.length) readAtLabel = m.readBy[keys[0]];
      }
      if (isAdmin() || isTeacher()) {
        if (isRead && readAtLabel) {
          readHtml = '<div class="read-status lu">✓ Lu le ' + esc(readAtLabel) + '</div>';
        } else if (isRead) {
          readHtml = '<div class="read-status lu">✓ Lu</div>';
        } else {
          readHtml = '<div class="read-status nonlu">○ Non lu</div>';
        }
      } else {
        // Parent : voit si l'administration (ou enseignant) a lu
        if (isRead && readAtLabel) {
          readHtml = '<div class="read-status lu">✓ Lu le ' + esc(readAtLabel) + '</div>';
        } else if (isRead) {
          readHtml = '<div class="read-status lu">✓ Lu</div>';
        } else {
          readHtml = '<div class="read-status nonlu">○ En attente de lecture</div>';
        }
      }
    }
    return '<div class="' + cls + '">'
      + '<div class="msg-meta">' + esc(m.from) + ' · ' + esc(m.date)
      + (m.subject ? ' · <b>' + esc(m.subject) + '</b>' : '')
      + ' · ' + messageDeliveryBadge(m)
      + '</div>'
      + esc(m.body).replace(/\n/g, "<br>")
      + attachHtml
      + readHtml
      + '<div style="margin-top:8px"><button class="btn secondary" onclick="moveMessageToTrash(' + m.id + ')">🗑 Supprimer</button></div>'
      + '</div>';
  }).join("") || empty();

  // Pour répondre : on prend le parentId / destinataire du dernier message pertinent
  var replyParentId = null;
  var replyToName = "Administration";
  if ((isAdmin() || isTeacher()) && last) {
    replyParentId = last.parentId;
    if (!replyParentId) {
      var par = (state.parents || []).find(function(p){ return p.name === last.to || p.name === last.from; });
      if (par) replyParentId = par.id;
    }
    if (last.to === myLabel()) {
      replyToName = last.from;
    } else {
      replyToName = last.from === myLabel() ? last.to : (last.from === "Administration" ? last.to : last.from);
    }
    if (replyToName === myLabel()) replyToName = last.to !== myLabel() ? last.to : "Administration";
  }

  var canReply = !last || !last.group; // pas de réponse directe sur un groupé (utiliser compose)
  var replyBtn = canReply
    ? '<button class="btn primary" onclick="replyInConv(\'' + key.replace(/'/g, "\\'") + '\', ' + (replyParentId || "null") + ', \'' + (replyToName || "").replace(/'/g, "\\'") + '\')">Répondre</button>'
    : '<p class="muted">Pour répondre à un message groupé, utilisez « Nouveau message » vers un parent précis.</p>';

  var exportBtns = '<button class="btn secondary" onclick="exportConversation(\'' + key.replace(/'/g, "\\'") + '\')">⬇ Export TXT</button>'
    + ' <button class="btn secondary" onclick="exportConversationHTML(\'' + key.replace(/'/g, "\\'") + '\')">⬇ Export HTML</button>';

  document.querySelector(".content").innerHTML = '<div class="panel">'
    + '<div class="panel-head">'
    + '<div><h2>' + esc(title) + '</h2>'
    + '<p class="muted">' + msgs.length + ' message' + (msgs.length > 1 ? "s" : "") + '</p></div>'
    + '<div>'
    + exportBtns
    + ' <button class="btn secondary" onclick="go(\'messages\')">Retour</button></div></div>'
    + '<div style="max-height:55vh;overflow-y:auto;padding:8px 0">' + threadHtml + '</div>'
    + '<div class="panel" style="margin-top:10px;background:#f8fafc;border:1px solid #e5e7eb">'
    + '<h3 style="margin-top:0">📍 Suivi de lecture</h3>'
    + '<p class="muted" style="margin-bottom:8px">Pour les messages envoyés, le statut évolue de <b>Envoyé</b> à <b>Distribué</b>, puis <b>Lu</b> lorsque le destinataire ouvre le message. Les dates sont conservées dans l’historique.</p>'
    + (msgs.filter(function(x){return x.from===myLabel() && !x.group;}).slice(-3).reverse().map(function(x){
        return '<div style="padding:8px 0;border-top:1px solid #e5e7eb"><b>'+esc(x.subject||"Sans objet")+'</b><div class="muted">'+esc(x.to||"Administration")+' · '+messageDeliveryLabel(x)+'</div>'
          +(x.sentAt?'<div class="muted">Envoyé : '+esc(x.sentAt)+'</div>': '')
          +(x.deliveredAt?'<div class="muted">Distribué : '+esc(x.deliveredAt)+'</div>': '')
          +(x.readAt?'<div class="muted">Lu : '+esc(x.readAt)+'</div>': '')
          +'</div>';
      }).join("") || '<div class="muted">Aucun message envoyé dans cette conversation.</div>')
    + '</div>'
    + replyBtn
    + '</div>';
}

function replyInConv(key, parentId, toName){
  var msgs=visibleMessages().filter(function(m){return convKey(m)===key;}).sort(function(a,b){return (a.id||0)-(b.id||0);});
  var last=msgs[msgs.length-1]||{};
  var targetId=null,targetRole=null,targetName=toName||"Administration";
  if(isAdmin()){
    if(last.recipientRole && last.recipientId){targetRole=last.recipientRole;targetId=Number(last.recipientId);}
    else if(last.senderRole && last.senderRole!=="admin" && last.senderId){targetRole=last.senderRole;targetId=Number(last.senderId);}
    else if(parentId){targetRole="parent";targetId=Number(parentId);}
    if(targetRole==="parent"){var p=(state.parents||[]).find(function(x){return Number(x.id)===targetId;});if(p)targetName=p.name;}
    if(targetRole==="teacher"){var t=(state.teachers||[]).find(function(x){return Number(x.id)===targetId;});if(t)targetName=t.name;}
  }
  var kjs=JSON.stringify(key), njs=JSON.stringify(targetName||"Administration"), rjs=JSON.stringify(targetRole||"admin"), ijs=targetId?String(targetId):"null";
  document.querySelector(".content").innerHTML='<div class="panel">'
    +'<div class="panel-head"><div><h2>Répondre</h2><p class="muted">À : '+esc(isAdmin()?targetName:"Administration")+'</p></div><button class="btn secondary" onclick="openConversation('+kjs+')">Retour</button></div>'
    +'<div class="field"><label>Objet</label><input id="sub" value="Re: '+esc(last.subject||"Conversation")+'"></div>'
    +'<div class="field"><label>Message</label><textarea id="body" placeholder="Votre réponse..."></textarea></div>'
    +'<div class="field"><label>Pièce jointe (facultatif, max 2 Mo)</label><input id="attach" type="file"></div>'
    +'<button class="btn primary" onclick="sendReplyInConv('+kjs+','+ijs+','+rjs+','+njs+')">Envoyer</button>'
    +' <button class="btn secondary" onclick="openConversation('+kjs+')">Annuler</button></div>';
}

function sendReplyInConv(key,targetId,targetRole,toName){
  if(!requireSession())return;
  var sub=((document.getElementById("sub")||{}).value||"").trim();
  var body=((document.getElementById("body")||{}).value||"").trim();
  if(!body)return toast("Écrivez une réponse");
  if(!sub)sub="Re: Conversation";
  var senderRole=isAdmin()?"admin":(isTeacher()?"teacher":"parent");
  var senderId=isAdmin()?"admin":(isTeacher()?currentTeacher().id:currentParent().id);
  var recipientRole=isAdmin()?(targetRole||"parent"):"admin";
  var recipientId=isAdmin()?(targetId?Number(targetId):null):null;
  var toLabel=isAdmin()?(toName||"Parent"):"Administration";
  var parentId=recipientRole==="parent"?recipientId:(senderRole==="parent"?Number(senderId):null);
  readAttachment(document.getElementById("attach")).then(function(attach){
    var msg={id:Date.now(),from:myLabel(),to:toLabel,subject:sub,body:body,date:nowStr(),read:false,readBy:{},attach:attach,parentId:parentId,recipientId:recipientId,recipientRole:recipientRole,senderId:senderId,senderRole:senderRole,group:null,deliveryStatus:"queued",sentAt:null,replyToKey:key};
    state.messages.push(msg);logActivity("Réponse envoyée",sub+" → "+toLabel);pushNotif("Nouveau message : "+sub+" — "+toLabel,"message","message",msg.id);save(false);
    publishMessageToServer(msg).then(function(ok){if(ok){msg.sentAt=nowStr();save(false);}});
    toast("Réponse envoyée");openConversation(key);
  });
}

function formatSize(bytes){
  if (bytes < 1024) return bytes + " o";
  if (bytes < 1048576) return (bytes/1024).toFixed(1) + " Ko";
  return (bytes/1048576).toFixed(1) + " Mo";
}

/** Lit le fichier sélectionné et retourne une Promise { name, size, type, data } (data = dataURL base64) */
function readAttachment(input){
  return new Promise(function(resolve){
    var f = input && input.files && input.files[0];
    if (!f) return resolve(null);
    // Limite ~2 Mo pour rester dans localStorage
    if (f.size > 2 * 1024 * 1024) {
      toast("Fichier trop volumineux (max 2 Mo)");
      return resolve(null);
    }
    var reader = new FileReader();
    reader.onload = function(){
      resolve({
        name: f.name,
        size: formatSize(f.size),
        type: f.type || "application/octet-stream",
        data: reader.result  // data:mime;base64,...
      });
    };
    reader.onerror = function(){
      toast("Erreur de lecture du fichier");
      resolve(null);
    };
    reader.readAsDataURL(f);
  });
}

/** Télécharge une pièce jointe stockée */
function downloadAttach(attach){
  if (!attach) return;
  if (!attach.data) {
    toast("Contenu non disponible (ancien message simulé)");
    return;
  }
  try {
    var a = document.createElement("a");
    a.href = attach.data;
    a.download = attach.name || "piece-jointe";
    document.body.appendChild(a);
    a.click();
    a.remove();
  } catch (e) {
    toast("Impossible de télécharger le fichier");
  }
}

  if (last.group) title = last.group === "ALL" ? "Message groupé — Tous les parents" : "Classe " + last.group;
  else if (isAdmin()) {
    var other = last.from === "Administration" ? last.to : last.from;

  }

  var lines = [];

  lines.push("================================================");
  lines.push("");
  lines.push(title);
  lines.push("Exporté le : " + nowStr());
  lines.push("Nombre de messages : " + msgs.length);
  lines.push("");
  lines.push("------------------------------------------------");

  msgs.forEach(function(m, i){

  var text = lines.join("\n")
  var blob = new Blob([text], { type: "text/plain;charset=utf-8" });

function fileInfo(input){
  // compat legacy synchrone (nom/taille uniquement) — préférer readAttachment

  if (!f) return null;
  return { name: f.name, size: formatSize(f.size), type: f.type };
}

function formatVoiceSize(bytes){ return formatSize(bytes); }

function startVoiceRecording(){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder){
    return toast("L'enregistrement vocal n'est pas pris en charge par ce téléphone/navigateur");
  }
  if(window._gescoRecorder){ return toast("Un enregistrement est déjà en cours"); }
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
    var chunks=[];
    var mime="audio/webm";
    try{
      var candidates=["audio/webm;codecs=opus","audio/mp4","audio/webm","audio/ogg;codecs=opus"];
      for(var i=0;i<candidates.length;i++){ if(MediaRecorder.isTypeSupported(candidates[i])){mime=candidates[i];break;} }
    }catch(e){}
    var rec=new MediaRecorder(stream,{mimeType:mime});
    window._gescoRecorder={rec:rec,stream:stream,chunks:chunks,start:Date.now()};
    var btn=document.getElementById("voiceBtn"), status=document.getElementById("voiceStatus");
    if(btn){btn.textContent="⏹ Arrêter";btn.onclick=stopVoiceRecording;}
    if(status) status.textContent="🔴 Enregistrement… 0 s";
    window._gescoVoiceTimer=setInterval(function(){
      var sec=Math.floor((Date.now()-window._gescoRecorder.start)/1000);
      if(status) status.textContent="🔴 Enregistrement… "+sec+" s";
      if(sec>=120) stopVoiceRecording();
    },500);
    rec.ondataavailable=function(e){if(e.data && e.data.size) chunks.push(e.data);};
    rec.onstop=function(){
      clearInterval(window._gescoVoiceTimer); window._gescoVoiceTimer=null;
      stream.getTracks().forEach(function(t){t.stop();});
      var blob=new Blob(chunks,{type:mime});
      window._gescoRecorder=null;
      if(blob.size>2*1024*1024){
        window._gescoVoiceAttachment=null;
        if(status) status.textContent="Enregistrement trop volumineux (max 2 Mo)";
        return toast("Message vocal trop volumineux (max 2 Mo)");
      }
      var reader=new FileReader();
      reader.onload=function(){
        var ext=/mp4/i.test(mime)?"m4a":(/ogg/i.test(mime)?"ogg":"webm");
        window._gescoVoiceAttachment={name:"message-vocal-"+Date.now()+"."+ext,size:formatVoiceSize(blob.size),type:mime,data:reader.result,duration:Math.round((Date.now()-window._gescoVoiceStart)/1000)||0};
        renderVoicePreview();
      };
      reader.readAsDataURL(blob);
    };
    window._gescoVoiceStart=Date.now();
    rec.start();
  }).catch(function(){ toast("Autorisez le microphone pour enregistrer un message vocal"); });
}
function stopVoiceRecording(){
  var r=window._gescoRecorder;
  if(r && r.rec && r.rec.state!=="inactive") r.rec.stop();
  var btn=document.getElementById("voiceBtn"), status=document.getElementById("voiceStatus");
  if(btn){btn.textContent="🎙 Enregistrer";btn.onclick=startVoiceRecording;}
  if(status) status.textContent="Préparation du message vocal…";
}
function clearVoiceRecording(){ window._gescoVoiceAttachment=null; renderVoicePreview(); }
function renderVoicePreview(){
  var box=document.getElementById("voicePreview"); if(!box)return;
  var v=window._gescoVoiceAttachment;
  box.innerHTML=v ? '<div class="voice-chip">🎙 <span>'+esc(v.name)+' ('+esc(v.size)+')</span><audio class="voice-player" controls src="'+v.data+'"></audio><button type="button" class="btn secondary" onclick="clearVoiceRecording()">Supprimer</button></div>' : '';
  var st=document.getElementById("voiceStatus"); if(st && !v) st.textContent="Aucun message vocal";
}


function draftLabel(d){ return (d.subject || "Sans objet") + (d.to ? " · " + d.to : ""); }
function saveDraft(){
  if (!requireSession()) return;
  var sub=(document.getElementById("sub")||{}).value||"";
  var body=(document.getElementById("body")||{}).value||"";
  var toEl=document.getElementById("to");
  var to=toEl ? toEl.value : "";
  if(!sub.trim() && !body.trim() && !to.trim()) return toast("Brouillon vide");

}
function deleteDraft(id){

}
function editDraft(id){
  var d=(state.drafts||[]).find(function(x){return x.id===Number(id);}); if(!d)return;
  compose();
  setTimeout(function(){
    var sub=document.getElementById("sub"), body=document.getElementById("body"), to=document.getElementById("to");
    if(sub)sub.value=d.subject||""; if(body)body.value=d.body||"";
    if(to){for(var i=0;i<to.options.length;i++){if(to.options[i].value===d.to){to.selectedIndex=i;break;}}}
    window._editingDraftId=d.id;

}
function markAllMessagesRead(){
  if(!requireSession())return;
  var changed=false;
  visibleMessages().forEach(function(m){if(isMsgUnreadForMe(m)){m.read=true;m.readAt=m.readAt||nowStr();m.deliveryStatus="read";changed=true;}});
  if(changed){save();toast("Tous les messages visibles sont marqués comme lus");} else toast("Aucun message non lu");

function moveMessageToTrash(id){
  if(!requireSession()) return;
  var m=(state.messages||[]).find(function(x){return String(x.id)===String(id);});
  if(!m) return toast("Message introuvable");
  if(!Array.isArray(state.trashMessages)) state.trashMessages=[];
  if(!state.trashMessages.some(function(x){return String(x.id)===String(id);})){ state.trashMessages.push(Object.assign({},m,{deletedAt:nowStr(),deletedBy:myLabel()})); }
  state.messages=state.messages.filter(function(x){return String(x.id)!==String(id);});
  save(); toast("Message déplacé dans la corbeille"); go("messages");
}
function restoreTrashMessage(id){
  var m=(state.trashMessages||[]).find(function(x){return String(x.id)===String(id);});
  if(!m)return;
  var copy=Object.assign({},m); delete copy.deletedAt; delete copy.deletedBy;
  state.messages.push(copy); state.trashMessages=state.trashMessages.filter(function(x){return String(x.id)!==String(id);});
  save(); toast("Message restauré"); openTrash();
}
function permanentlyDeleteTrashMessage(id){

}
function emptyTrash(){
  if(!(state.trashMessages||[]).length)return toast("La corbeille est déjà vide");

  state.trashMessages=[]; save(); toast("Corbeille vidée"); openTrash();
}
function openTrash(){
  if(!requireSession())return;
  var list=(state.trashMessages||[]).slice().reverse();
  document.querySelector(".content").innerHTML='<div class="panel-head"><div><h1>🗑 Corbeille</h1><p class="muted">Messages supprimés de votre messagerie sur ce téléphone.</p></div><div><button class="btn secondary" onclick="go(\'messages\')">Retour</button> <button class="btn secondary" onclick="emptyTrash()">Vider</button></div></div>'
    +'<div class="panel"><div class="list">'+(list.map(function(m){return '<div class="item"><div class="item-head"><b>'+esc(m.subject||"Sans objet")+'</b><span class="badge">Supprimé</span></div><p class="muted">'+esc(m.date||"")+' · '+esc(m.from||"")+' → '+esc(m.to||"")+'</p><div>'+esc((m.body||"").slice(0,180))+'</div><p class="muted">Supprimé le '+esc(m.deletedAt||"—")+'</p><button class="btn secondary" onclick="restoreTrashMessage('+m.id+')">↩ Restaurer</button> <button class="btn secondary" onclick="permanentlyDeleteTrashMessage('+m.id+')">Supprimer définitivement</button></div>';}).join('')||empty())+'</div></div>';
}

function compose(){
  var admin = isAdmin();
  var supervisor = isSupervisor();
  // Reconnaissance de secours du rôle pour les sessions locales et réseau.
  var _su = state && state.api && state.api.serverUser;
  var _suRole = _su && String(_su.role || _su.type || _su.username || _su.name || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[ _-]+/g, "");
  if (!supervisor && (state.user === "supervisor:1" || state.user === "supervisor" || _suRole === "supervisor" || _suRole === "surveillant" || _suRole === "surveillantgeneral")) supervisor = true;
  var teacher = isTeacher() && !supervisor;
  var target = window._communicationTarget || null;
  var recipients = "";
  if (admin || supervisor) {
    var activeParents = (Array.isArray(state.parents) ? state.parents : []).filter(function(p){ return p && p.active !== false && p.name; });
    recipients += activeParents.map(function(p){
      var kids = (p.children && p.children.length) ? p.children : (p.student ? [{ name: p.student, className: p.className }] : []);
      var label = kids.map(function(c){ return c.name + (c.className ? " (" + c.className + ")" : ""); }).join(", ") || "Élève non renseigné";
      return '<option value="' + esc(p.name) + '" data-id="' + p.id + '" data-kind="parent">' + esc(p.name) + " — " + esc(label) + '</option>';
    }).join("");
    if (supervisor && !admin && !activeParents.length) {
      recipients = '<option value="" disabled selected>Aucun compte parent actif — contactez l’administration</option>';
    }
    if (admin) recipients += (state.teachers || []).filter(function(t){ return t.active !== false; }).map(function(t){
      return '<option value="' + esc(t.name) + '" data-id="' + t.id + '" data-kind="teacher">' + esc(t.name) + ' — Enseignant</option>';
    }).join("");
  } else if (teacher) {
    recipients = '<option value="Administration" data-kind="admin">Administration</option>';
  } else {
    recipients = '<option value="Administration" data-kind="admin">Administration</option>';
  }

  var tplHtml = "";
  if (admin && (state.templates || []).length) {
    tplHtml = '<div class="field"><label>Modèles de message</label><div>'
      + state.templates.map(function(t){
          return '<span class="tpl-chip" onclick="applyTemplate(' + t.id + ')">' + esc(t.title) + '</span>';
        }).join("")
      + '</div></div>';
  }

  document.querySelector(".content").innerHTML = '<div class="panel">'
    + '<div class="panel-head"><div><h2>' + (target ? '💬 Conversation avec ' + esc(target.name) : 'Nouveau message') + '</h2><p class="muted">' + (admin ? 'Destinataire parent ou enseignant.' : (supervisor ? 'Le surveillant général peut contacter individuellement les parents pour les absences, retards ou questions disciplinaires.' : 'Vous pouvez écrire à l’administration.')) + '</p></div><button class="btn secondary" onclick="go(\'messages\')">Retour</button></div>'
    + '<div class="field"><label>Destinataire</label><select id="to"' + (target ? ' disabled' : '') + '>' + (recipients || "<option value=''>Aucun destinataire</option>") + '</select></div>'
    + tplHtml
    + '<div class="field"><label>Objet</label><input id="sub" placeholder="Objet du message"></div>'
    + '<div class="field"><label>Message</label><textarea id="body" placeholder="Écrivez votre message..."></textarea></div>'
    + '<div class="field"><label>Pièce jointe (facultatif, max 2 Mo)</label><input id="attach" type="file"></div><div class="field"><label>Message vocal</label><div class="voice-box"><button type="button" id="voiceBtn" class="btn secondary" onclick="startVoiceRecording()">🎙 Enregistrer</button><span id="voiceStatus" class="voice-status">Aucun message vocal</span></div><div id="voicePreview"></div></div>'
    + '<button class="btn primary" onclick="sendMsg()">Envoyer</button>'
    + '</div>';

  if (target) {
    var sel = document.getElementById("to");
    if (sel) {
      for (var i=0;i<sel.options.length;i++) {
        if (sel.options[i].dataset.kind === target.kind && Number(sel.options[i].dataset.id) === Number(target.id)) {
          sel.selectedIndex = i; break;
        }
      }
    }
    window._communicationTarget = null;
  }
}
function applyTemplate(id){
  var t = (state.templates || []).find(function(x){ return x.id === id; });
  if (!t) return;
  var sub = document.getElementById("sub");
  var body = document.getElementById("body");
  if (sub) sub.value = t.subject || "";

function composeGroup(){

function sendMsg(){
  if (!requireSession()) return;
  var sub = document.getElementById("sub").value.trim();
  var body = document.getElementById("body").value.trim();
  var toSelect = document.getElementById("to");
  var to = toSelect ? toSelect.value : "";
  if (!to) return toast("Aucun destinataire disponible. Vérifiez les comptes parents actifs.");
  if (!sub || !body) return toast("Veuillez remplir l'objet et le message");
  var admin = isAdmin();
  var teacher = isTeacher();
  var supervisor = isSupervisor();
  var parentId = null;
  var recipientId = null;
  var recipientRole = null;
  var toLabel = to;
  if (admin || teacher || supervisor) {
    var sel = document.getElementById("to");
    var opt = sel.options[sel.selectedIndex];
    recipientId = opt && opt.dataset && opt.dataset.id ? Number(opt.dataset.id) : null;
    recipientRole = opt && opt.dataset && opt.dataset.kind ? opt.dataset.kind : null;
    if (recipientRole === "parent") parentId = recipientId;
    if (to === "Administration") { toLabel = "Administration"; recipientId = null; recipientRole = "admin"; }
  } else {
    var me = currentParent();
    parentId = me ? me.id : null;
    recipientRole = "admin";
    toLabel = "Administration";
  }
  var btn = document.querySelector(".content .btn.primary");
  if (btn) { btn.disabled = true; btn.textContent = "Envoi…"; }
  readAttachment(document.getElementById("attach")).then(function(attach){
    var msg = {
      id: Date.now(),
      from: myLabel(),
      to: toLabel,
      subject: sub,
      body: body,
      date: nowStr(),
      read: false,
      readBy: {},
      deliveryStatus: "queued",
      sentAt: null, deliveredAt: null, readAt: null,
      attach: attach,
      voice: window._gescoVoiceAttachment || null,
      parentId: parentId,
      recipientId: recipientId,
      recipientRole: recipientRole,
      senderId: isAdmin() ? "admin" : (isTeacher() ? currentTeacher().id : (isSupervisor() ? 1 : currentParent().id)),
      senderRole: isAdmin() ? "admin" : (isTeacher() ? "teacher" : (isSupervisor() ? "supervisor" : "parent")),
      group: null
    };
    state.messages.push(msg);
    if(window._editingDraftId){ state.drafts=(state.drafts||[]).filter(function(d){return d.id!==Number(window._editingDraftId);}); window._editingDraftId=null; }
    window._gescoVoiceAttachment = null;
    logActivity("Message envoyé", sub + " → " + toLabel);
    pushNotif("Nouveau message : " + sub + " — " + toLabel, "message", "message", msg.id);
    var waN = 0;
    if ((admin || teacher || supervisor) && parentId) {
      triggerAutoSMS("message", { parentId: parentId, subject: sub });
      waN = triggerAutoWhatsApp("message", { parentId: parentId, subject: sub, fullBody: body });
    }
    save(false);
    publishMessageToServer(msg).then(function(ok){ if(ok){ msg.sentAt=nowStr(); save(false); } });
    var extra = "";
    if ((admin || teacher || supervisor) && parentId) {
      if (waEnabled() && waN) extra += " + WhatsApp";
      if (smsEnabled()) extra += " + SMS";
    }
    toast((attach ? "Message envoyé avec pièce jointe" : "Message envoyé") + extra);
    go("messages");
  });
}

function sendGroupMsg(){
  if (!requireSession()) return;
  var sub = document.getElementById("sub").value.trim();
  var body = document.getElementById("body").value.trim();
  var target = document.getElementById("groupTarget").value;
  if (!sub || !body) return toast("Veuillez remplir l'objet et le message");
  var targets = target === "ALL"
    ? state.parents
    : state.parents.filter(function(p){
        if (p.className === target) return true;
        return (p.children || []).some(function(c){ return c.className === target; });
      });
  if (!targets.length) return toast("Aucun parent pour cette cible");
  var groupLabel = target === "ALL" ? "Tous les parents" : "Classe " + target;
  var btn = document.querySelector(".content .btn.primary");
  if (btn) { btn.disabled = true; btn.textContent = "Envoi…"; }
  readAttachment(document.getElementById("attach")).then(function(attach){
    var msg = {
      id: Date.now(),
      from: "Administration",
      to: groupLabel,
      subject: sub,
      body: body,
      date: nowStr(),
      read: false,
      readBy: {},
      attach: attach,
      parentId: null,
      group: target,
      deliveryStatus: "queued",
      sentAt: null, deliveredAt: null, readAt: null
    };
    state.messages.push(msg);
    pushNotif("Message groupé envoyé à " + groupLabel + " : " + sub, "message", "message", msg.id);
    triggerAutoSMS("message", { group: target, subject: sub });
    var waN = triggerAutoWhatsApp("message", { group: target, subject: sub, fullBody: body });
    save(false);
    publishMessageToServer(msg).then(function(ok){ if(ok){ msg.sentAt=nowStr(); save(false); } });
    var extra = "";
    if (waEnabled() && waN) extra += " + " + waN + " WhatsApp";
    if (smsEnabled()) extra += " + SMS";
    toast("Message groupé envoyé à " + targets.length + " parent(s)" + extra);
    go("messages");
  });
}

  openConversation(convKey(m));
}

  openConversation(convKey(m));
}

function sendReply(id){

  });
  return `<div class="panel-head">
      <div><h1>Annonces</h1><p class="muted">Informations diffusées aux parents. Les annonces épinglées restent en tête.</p></div>
      ${admin?'<button class="btn primary" onclick="newAnnonce()">Nouvelle annonce</button>':''}
    </div>

      ${list.map(a => `<div class="panel" id="annonce-${a.id}" style="${a.pinned?'border-color:var(--primary);border-width:2px':''}">

/* ========== NOTIFICATIONS + HISTORIQUE CENTRALISÉ (ÉTAPE 6) ========== */

  return map[n.type] || "Information";
}
function notifications(){
  var all=visibleNotifications().slice().reverse();
  var unread=all.filter(function(n){return !n.read;}).length;
  var counts={message:0,annonce:0,absence:0,bulletin:0,event:0,info:0};

    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn secondary" onclick="markAllNotifs()">✓ Tout marquer comme lu</button>
      <button class="btn danger" onclick="clearNotifications()">Effacer l'historique</button>
    </div>
  </div>
  <div class="grid" style="margin-bottom:15px">
    <div class="stat"><div class="stat-label">Total</div><div class="stat-value">${all.length}</div></div>

      ${all.map(function(n){return notificationItemHtml(n);}).join("") || empty()}
    </div>
  </div>`;
}
function notificationItemHtml(n){
  return `<div class="item clickable notification-row" data-notif-type="${esc(n.type||'info')}" onclick="openNotif(${n.id})">
    <div class="item-head"><b>${esc(n.text)}</b>${!n.read?'<span class="badge badge-new">Nouveau</span>':'<span class="muted">✓ Lu</span>'}</div>
    <p class="muted">${esc(n.date)} · ${esc(notificationKindLabel(n))}${n.readAt?' · Lu le '+esc(n.readAt):''}</p>
  </div>`;
}
function filterNotifications(type){
  document.querySelectorAll('.notification-row').forEach(function(row){
    row.style.display=(type==='all'||row.getAttribute('data-notif-type')===type)?'':'none';
  });
}
function markNotificationRead(n){
  if(!n) return;
  n.read=true;
  n.readAt=nowStr();
  if(!n.readBy) n.readBy={};
  n.readBy[isAdmin()?'admin':(isTeacher()?'teacher':'parent')]=n.readAt;
  n.syncState='pending';
  markLocalChange();
  logActivity("Notification lue", n.text);
}
function openNotif(id){
  var n=state.notifications.find(function(x){return x.id===id;});
  if(!n)return;
  if(!n.read)markNotificationRead(n); else save(false);
  if(n.refType==='message'&&n.refId){var m=state.messages.find(function(x){return x.id===n.refId;});if(m){save(false);openMsg(m.id);return;}}
  if(n.refType==='annonce'&&n.refId){save(false);go('annonces');return;}
  if(n.refType==='bulletin'||n.refType==='absence'){window._suiviTab=n.refType==='absence'?'absences':'bulletins';save(false);go('suivi');return;}
  save(false);go('notifications');
}
function markAllNotifs(){
  var list=isAdmin()?state.notifications:visibleNotifications();
  list.forEach(function(n){if(!n.read)markNotificationRead(n);});
  save();go('notifications');
}
function clearNotifications(){
  if(!confirm("Effacer les notifications visibles ?"))return;
  var visible=visibleNotifications();
  var ids={};visible.forEach(function(n){ids[n.id]=true;});
  if(isAdmin())state.notifications=[];
  else state.notifications=state.notifications.filter(function(n){return !ids[n.id];});
  markLocalChange();
  logActivity("Historique des notifications effacé", isAdmin()?"Toutes les notifications":"Notifications visibles");
  save();go('notifications');
}

async function syncNotificationsWithServer(silent){
  if(!state.api||!state.api.enabled||!state.api.baseUrl)return false;
  try{
    var payload={schoolId:state.api.schoolId,deviceId:state.api.deviceId,notifications:state.notifications||[],lastSyncAt:state.api.notificationsSyncAt||null};
    var r=await apiRequest('/api/notifications/sync',{method:'POST',body:JSON.stringify(payload)});
    if(r&&Array.isArray(r.notifications)){
      var local=state.notifications||[], byId={};local.forEach(function(n){byId[n.id]=n;});
      r.notifications.forEach(function(n){if(!byId[n.id]||n.updatedAt>byId[n.updatedAt||''])byId[n.id]=n;});
      state.notifications=Object.keys(byId).map(function(k){return byId[k];}).sort(function(a,b){return (a.id||0)-(b.id||0);}).slice(-150);
    }
    state.api.notificationsSyncAt=new Date().toISOString();
    state.api.notificationsPending=0;
    save(false);
    return true;
  }catch(e){
    state.api.notificationsPending=state.notifications.filter(function(n){return n.syncState==='pending';}).length;
    save(false);
    if(!silent)toast('Notifications conservées localement — serveur indisponible');
    return false;
  }
}

function parentCard(p){
  var kids = (p.children && p.children.length)
    ? p.children
    : (p.student ? [{ name: p.student, className: p.className }] : []);
  var kidsHtml = kids.map(function(c){
    return '<span class="badge" style="margin:2px">' + esc(c.name) + ' · ' + esc(c.className) + '</span>';
  }).join(" ") || '<span class="muted">Aucun élève</span>';
  var classes = kids.map(function(c){ return c.className; }).filter(function(v,i,a){ return a.indexOf(v)===i; });
  return `<div class="item" data-parent="${p.id}">
    <div class="item-head"><b>${esc(p.name)}</b><span class="badge">${kids.length} élève${kids.length>1?"s":""}</span></div>
    <p>${kidsHtml}</p>
    <p class="muted">Téléphone : ${esc(p.phone)}</p>
    <button class="btn primary" onclick="messageParent(${p.id})">✉ Écrire</button>

function filterParents(){
  let q = (document.getElementById("parentSearch")?.value || "").toLowerCase();
  document.querySelectorAll("[data-parent]").forEach(el => {
    let p = (state.parents || []).find(x => String(x.id) === el.dataset.parent);
    if (!p) return;
    let kidsStr = (p.children || []).map(function(c){ return c.name + " " + c.className; }).join(" ");
    let hay = (p.name + " " + (p.student||"") + " " + (p.className||"") + " " + p.phone + " " + kidsStr).toLowerCase();
    el.style.display = !q || hay.includes(q) ? "" : "none";
  });
}

function messageParent(id){
  let p = state.parents.find(x => x.id === id);
  document.querySelector(".content").innerHTML = `<div class="panel">
    <div class="panel-head">
      <div><h2>Écrire à ${esc(p.name)}</h2><p class="muted">${((p.children||[]).length ? (p.children.map(function(c){return c.name+" ("+c.className+")"}).join(", ")) : (esc(p.student)+" · "+esc(p.className)))}</p></div>

function sendToParent(id){
  let p = state.parents.find(x => x.id === id);
  let sub = document.getElementById("sub").value.trim();
  let body = document.getElementById("body").value.trim();
  if (!sub || !body) return toast("Veuillez remplir l'objet et le message");
  let btn = document.querySelector(".content .btn.primary");
  if (btn) { btn.disabled = true; btn.textContent = "Envoi…"; }
  readAttachment(document.getElementById("attach")).then(function(attach){
    let msg = {
      id: Date.now(), from: "Administration", to: p.name, subject: sub, body: body,
      date: nowStr(), read: false, attach: attach, parentId: id, group: null
    };
    state.messages.push(msg);
    pushNotif("Message envoyé à " + p.name, "message", "message", msg.id);
    triggerAutoSMS("message", { parentId: id, subject: sub });
    var waN = triggerAutoWhatsApp("message", { parentId: id, subject: sub, fullBody: body });
    save();
    var extra = "";
    if (waEnabled() && waN) extra += " + WhatsApp";
    if (smsEnabled()) extra += " + SMS";
    toast("Message envoyé à " + p.name + extra);
    go("messages");
  });
}

function collectChildren(){
  var names = document.querySelectorAll(".child-name");
  var classes = document.querySelectorAll(".child-class");
  var kids = [];
  for (var i = 0; i < names.length; i++) {
    var n = names[i].value.trim();
    var c = classes[i] ? classes[i].value : "";
    if (n) kids.push({ name: n, className: c });
  }
  return kids;
}

function saveParent(){
  var name = document.getElementById("pn").value.trim();
  var phone = document.getElementById("pp").value.trim();
  var children = collectChildren();
  if (!name || !phone) return toast("Nom et téléphone obligatoires");
  if (!children.length) return toast("Ajoutez au moins un élève");
  var password = phoneAsPassword(phone);
  if (!password) return toast("Numéro de téléphone invalide");
  hashPassword(password).then(function(h){
    state.parents.push({
      id: Date.now(),
      active: true,
      name: name,
      phone: phone,
      password: h,
      children: children,
      student: children[0].name,
      className: children[0].className
    });
    save();
    toast("Parent ajouté — " + children.length + " élève(s)");
    go("parents");
  });
}

function editParent(id){
  var p = state.parents.find(function(x){ return x.id === id; });
  if (!p) return;
  var kids = (p.children && p.children.length)
    ? p.children
    : (p.student ? [{ name: p.student, className: p.className }] : [{ name: "", className: (state.classes[0] || "") }]);
  var classOpts = function(selected){
    return (state.classes || []).map(function(c){
      return '<option value="' + esc(c) + '"' + (c === selected ? ' selected' : '') + '>' + esc(c) + '</option>';
    }).join("");

      + '<div class="field" style="margin:0"><label>Classe</label><select class="child-class">' + classOpts(k.className) + '</select></div>'

    + '<div class="field"><label>Téléphone</label><input id="pp" value="' + esc(p.phone) + '"></div>'
    + '<p class="muted" style="grid-column:1/-1">Mot de passe = n° de téléphone (synchronisé à l\'enregistrement).</p>'
    + '</div>'
    + '<h3 style="margin-top:18px">Élèves</h3>'
    + '<div id="childrenFields">' + rows + '</div>'
    + '<button class="btn secondary" type="button" onclick="addChildRow()" style="margin:8px 0">+ Ajouter un élève</button>'
    + '<div style="margin-top:14px">'
    + '<button class="btn primary" onclick="updateParent(' + id + ')">Enregistrer</button> '
    + '<button class="btn secondary" onclick="go(\'parents\')">Annuler</button>'
    + '</div></div>';
}

function updateParent(id){
  var p = state.parents.find(function(x){ return x.id === id; });
  if (!p) return;
  p.name = document.getElementById("pn").value.trim();
  p.phone = document.getElementById("pp").value.trim();
  p.children = collectChildren();
  if (!p.name || !p.phone) return toast("Nom et téléphone obligatoires");
  if (!p.children.length) return toast("Ajoutez au moins un élève");
  p.student = p.children[0].name;
  p.className = p.children[0].className;
  var password = phoneAsPassword(p.phone);
  hashPassword(password).then(function(h){
    p.password = h;
    save();
    toast("Parent modifié — mot de passe = n° de téléphone");
    go("parents");
  });
}

function deleteParent(id){
  if (!confirm("Supprimer ce contact et les données liées (messages, notes, absences, bulletins des enfants) ?")) return;
  var p = (state.parents || []).find(function(x){ return x.id === id; });
  var kidNames = [];
  if (p) {
    var kids = (p.children && p.children.length) ? p.children : (p.student ? [{ name: p.student }] : []);
    kidNames = kids.map(function(c){ return c.name; });
  }
  state.parents = state.parents.filter(function(x){ return x.id !== id; });
  state.messages = (state.messages || []).filter(function(m){ return m.parentId !== id; });
  if (kidNames.length) {
    state.grades = (state.grades || []).filter(function(g){ return kidNames.indexOf(g.student) === -1; });
    state.absences = (state.absences || []).filter(function(a){ return kidNames.indexOf(a.student) === -1; });
    state.bulletins = (state.bulletins || []).filter(function(b){ return kidNames.indexOf(b.student) === -1; });
  }
  save();
  logActivity("Suppression parent", p ? p.name : String(id));
  toast("Parent et données liées supprimés");
  go("parents");
}

/* ========== IMPORT CSV ========== */
function importParents(){
  document.querySelector(".content").innerHTML = `<div class="panel">
    <div class="panel-head"><h2>Import CSV des parents</h2><button class="btn secondary" onclick="go('parents')">Retour</button></div>
    <p class="muted">Format attendu (une ligne par parent) :<br>
      <code>Nom parent;Téléphone;Nom élève;Classe</code><br>
      Exemple : <code>Jean Dupont;+237 6 99 88 77 66;Marie Dupont;6e A</code>
    </p>
    <div class="field"><label>Coller les lignes CSV</label>
      <textarea id="csvText" placeholder="Jean Dupont;+237 6 99 88 77 66;Marie Dupont;6e A&#10;Paul Martin;+237 6 11 22 33 44;Lucie Martin;5e A"></textarea>
    </div>
    <div class="field"><label>Ou charger un fichier .csv / .txt</label>
      <input type="file" id="csvFile" accept=".csv,.txt,text/csv,text/plain" onchange="loadCsvFile()">
    </div>
    <button class="btn primary" onclick="doImportCsv()">Importer</button>
  </div>`;
}

function loadCsvFile(){
  let f = document.getElementById("csvFile")?.files?.[0];
  if (!f) return;
  let reader = new FileReader();
  reader.onload = e => {
    document.getElementById("csvText").value = e.target.result || "";
  };
  reader.readAsText(f, "UTF-8");
}

function doImportCsv(){
  let text = document.getElementById("csvText").value.trim();
  if (!text) return toast("Aucun contenu à importer");
  let lines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  let added = 0, merged = 0, skipped = 0;
  lines.forEach(line => {
    // ignorer en-tête éventuel
    if (/^nom/i.test(line) && /classe/i.test(line)) return;
    let parts = line.split(/[;,\t]/).map(p => p.trim());
    if (parts.length < 4) { skipped++; return; }
    let [name, phone, student, className] = parts;
    if (!name || !phone || !student || !className) { skipped++; return; }
    // ajouter la classe si absente
    if (!state.classes.includes(className)) state.classes.push(className);
    var phoneKey = phoneAsPassword(phone);
    var existing = (state.parents || []).find(function(p){
      return phoneAsPassword(p.phone) === phoneKey;
    });
    if (existing) {
      // Fusionner : ajouter l'élève s'il n'existe pas déjà
      if (!Array.isArray(existing.children)) existing.children = [];
      var already = existing.children.some(function(c){
        return c.name === student && c.className === className;
      });
      if (!already) {
        existing.children.push({ name: student, className: className });
        existing.student = existing.children[0].name;
        existing.className = existing.children[0].className;
        if (name && existing.name !== name) existing.name = name;
        merged++;
      } else {
        skipped++;
      }
      return;
    }
    state.parents.push({
      id: Date.now() + added + merged + 1,
      name: name,
      phone: phone,
      student: student,
      className: className,
      password: phoneKey,
      children: [{ name: student, className: className }]
    });
    added++;
  });
  save();
  setTimeout(function(){ migratePlainPasswords(); }, 50);
  try { logActivity("Import CSV parents", added + " ajoutés, " + merged + " fusionnés"); save(); } catch (e) {}
  var msg = added + " parent(s) ajouté(s)";
  if (merged) msg += ", " + merged + " fusionné(s) (même téléphone)";
  if (skipped) msg += ", " + skipped + " ligne(s) ignorée(s)";
  toast(msg);
  go("parents");
}


function downloadTextFile(filename, text, mime){
  try {
    var blob = new Blob([text], { type: mime || "text/plain;charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function(){ try { URL.revokeObjectURL(url); } catch (e) {} }, 2000);
  } catch (e) {
    toast("Téléchargement impossible");
  }
}

/** Export annuaire parents au format CSV (compatible ré-import) */
function exportParentsCsv(){
  if (!isAdmin()) return toast("Accès réservé");
  var lines = ["Nom parent;Téléphone;Nom élève;Classe"];
  (state.parents || []).forEach(function(p){
    var kids = (p.children && p.children.length) ? p.children : (p.student ? [{ name: p.student, className: p.className }] : []);
    if (!kids.length) {
      lines.push([p.name, p.phone, "", ""].map(csvEscape).join(";"));
      return;
    }
    kids.forEach(function(c){
      lines.push([p.name, p.phone, c.name, c.className].map(csvEscape).join(";"));
    });
  });
  downloadTextFile("parents-cst-manjo.csv", lines.join("\n"), "text/csv;charset=utf-8");
  toast((state.parents || []).length + " parent(s) exporté(s)");
}

function csvEscape(v){
  var s = String(v == null ? "" : v);
  if (/[;"\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
  return s;
}

/** Export des notes scolaires */
function exportGradesCsv(){
  if (!isAdmin() && !isTeacher()) return toast("Accès réservé");
  var lines = ["Élève;Classe;Matière;Évaluation;Note;Sur;Date;Appréciation;Saisi par"];
  var grades = state.grades || [];
  if (isTeacher()) {
    var t = currentTeacher();
    var subs = (t && t.subjects) || [];
    grades = grades.filter(function(g){ return subs.indexOf(g.subject) !== -1; });
  }
  grades.forEach(function(g){
    lines.push([g.student, g.className, g.subject, g.sequence, g.score, g.max || 20, g.date || "", g.comment || "", g.by || ""].map(csvEscape).join(";"));
  });
  downloadTextFile("notes-cst-manjo.csv", lines.join("\n"), "text/csv;charset=utf-8");
  toast(grades.length + " note(s) exportée(s)");
}

/** Export absences */
function exportAbsencesCsv(){
  if (!isAdmin()) return toast("Accès réservé");
  var lines = ["Élève;Classe;Date;Statut;Motif;Note admin"];
  (state.absences || []).forEach(function(a){
    lines.push([a.student, a.className, a.date, a.status || (a.justified ? "justified" : "open"), a.reason || "", a.adminNote || ""].map(csvEscape).join(";"));
  });
  downloadTextFile("absences-cst-manjo.csv", lines.join("\n"), "text/csv;charset=utf-8");
  toast((state.absences || []).length + " absence(s) exportée(s)");
}

function addClassPrompt(){
  let name = prompt("Nom de la nouvelle classe (ex. 1ère A4) :");
  if (!name) return;
  name = name.trim();
  if (!name) return;
  if (state.classes.includes(name)) return toast("Cette classe existe déjà");
  state.classes.push(name);
  save();
  toast("Classe ajoutée");
  go("classes");
}

function renameClass(i){
  let old = state.classes[i];
  let name = prompt("Nouveau nom de la classe :", old);
  if (!name) return;
  name = name.trim();
  if (!name) return;
  if (state.classes.includes(name) && name !== old) return toast("Cette classe existe déjà");
  state.classes[i] = name;
  state.parents.forEach(function(p){
    if (p.className === old) p.className = name;
    if (p.children) {
      p.children.forEach(function(c){ if (c.className === old) c.className = name; });
      if (p.children[0]) { p.student = p.children[0].name; p.className = p.children[0].className; }
    }
  });
  save();
  toast("Classe renommée");
  go("classes");
}

function deleteClass(i){
  let c = state.classes[i];
  let count = state.parents.filter(p => p.className === c).length;
  if (count > 0) {
    if (!confirm(`La classe "${c}" a ${count} parent(s). Supprimer quand même ? Les parents garderont l'ancienne valeur.`)) return;
  } else if (!confirm(`Supprimer la classe "${c}" ?`)) return;
  state.classes.splice(i, 1);
  save();
  toast("Classe supprimée");
  go("classes");
}

/* ========== CALENDRIER / ÉVÉNEMENTS ========== */
function eventsView(){
  var admin = isAdmin();
  var today = new Date();
  var year = window._calYear || today.getFullYear();
  var month = window._calMonth != null ? window._calMonth : today.getMonth();
  window._calYear = year;
  window._calMonth = month;

  var monthNames = ["Janvier","Février","Mars","Avril","Mai","Juin","Juillet","Août","Septembre","Octobre","Novembre","Décembre"];
  var dayNames = ["Lun","Mar","Mer","Jeu","Ven","Sam","Dim"];

  var first = new Date(year, month, 1);
  var startDow = (first.getDay() + 6) % 7; // Monday=0
  var daysInMonth = new Date(year, month + 1, 0).getDate();
  var todayStr = today.toISOString().slice(0, 10);

  var eventsByDate = {};
  (state.events || []).forEach(function(e){
    if (!eventsByDate[e.date]) eventsByDate[e.date] = [];
    eventsByDate[e.date].push(e);
  });

  var cells = "";
  dayNames.forEach(function(d){ cells += '<div class="cal-head">' + d + '</div>'; });

  for (var i = 0; i < startDow; i++) {
    cells += '<div class="cal-day other"></div>';
  }
  for (var d = 1; d <= daysInMonth; d++) {
    var ds = year + "-" + String(month + 1).padStart(2, "0") + "-" + String(d).padStart(2, "0");
    var isToday = ds === todayStr;
    var evs = eventsByDate[ds] || [];
    var evHtml = evs.map(function(e){
      return '<span class="ev' + (e.urgent ? ' urgent' : '') + '" title="' + esc(e.title) + '" onclick="event.stopPropagation();showEvent(' + e.id + ')">' + esc(e.title) + '</span>';
    }).join("");
    cells += '<div class="cal-day' + (isToday ? ' today' : '') + '"><div class="num">' + d + '</div>' + evHtml + '</div>';
  }

  var listUpcoming = (state.events || []).slice().sort(function(a, b){ return a.date < b.date ? -1 : 1; });

  var listHtml = listUpcoming.map(function(e){
    return '<div class="event-item' + (e.urgent ? ' urgent' : '') + ' clickable" onclick="showEvent(' + e.id + ')">'
      + '<div class="item-head"><b>' + esc(e.title) + '</b>'
      + (e.urgent ? '<span class="badge badge-new">Important</span>' : '')
      + '</div>'
      + '<p class="muted">' + esc(e.date) + (e.time ? ' · ' + esc(e.time) : '') + (e.place ? ' · ' + esc(e.place) : '') + '</p>'
      + '<div>' + esc(e.desc || '') + '</div>'
      + (admin ? '<button class="btn danger" style="margin-top:8px" onclick="event.stopPropagation();deleteEvent(' + e.id + ')">Supprimer</button>' : '')
      + '</div>';
  }).join("") || empty();

  return '<div class="panel-head">'
    + '<div><h1>Calendrier</h1><p class="muted">Événements et dates importantes du collège.</p></div>'
    + (admin ? '<button class="btn primary" onclick="newEvent()">+ Nouvel événement</button>' : '')
    + '</div>'
    + '<div class="panel">'
    + '<div class="panel-head">'
    + '<button class="btn secondary" onclick="calPrev()">←</button>'
    + '<h3 style="margin:0">' + monthNames[month] + ' ' + year + '</h3>'
    + '<button class="btn secondary" onclick="calNext()">→</button>'
    + '</div>'
    + '<div class="cal-grid">' + cells + '</div>'
    + '</div>'
    + '<div class="panel" style="margin-top:16px">'
    + '<div class="panel-head"><h3>Liste des événements</h3></div>'
    + listHtml
    + '</div>';
}

function calPrev(){
  window._calMonth--;
  if (window._calMonth < 0) { window._calMonth = 11; window._calYear--; }
  go("events");
}
function calNext(){
  window._calMonth++;
  if (window._calMonth > 11) { window._calMonth = 0; window._calYear++; }
  go("events");
}

function showEvent(id){
  var e = (state.events || []).find(function(x){ return x.id === id; });
  if (!e) return;
  document.querySelector(".content").innerHTML = '<div class="panel">'
    + '<div class="panel-head"><h2>' + esc(e.title) + '</h2><button class="btn secondary" onclick="go(\'events\')">Retour</button></div>'
    + (e.urgent ? '<span class="badge badge-new">Important</span>' : '')
    + '<p class="muted" style="margin-top:12px">' + esc(e.date) + (e.time ? ' · ' + esc(e.time) : '') + (e.place ? ' · ' + esc(e.place) : '') + '</p>'
    + '<p>' + esc(e.desc || '') + '</p>'
    + (isAdmin() ? '<button class="btn danger" onclick="deleteEvent(' + e.id + ')">Supprimer</button>' : '')
    + '</div>';
}

function newEvent(){
  document.querySelector(".content").innerHTML = '<div class="panel">'
    + '<div class="panel-head"><h2>Nouvel événement</h2><button class="btn secondary" onclick="go(\'events\')">Retour</button></div>'
    + '<div class="field"><label>Titre</label><input id="evTitle" placeholder="Ex. Réunion parents"></div>'
    + '<div class="grid2">'
    + '<div class="field"><label>Date</label><input id="evDate" type="date"></div>'

function saveEvent(){

function deleteEvent(id){

  state.events = state.events.filter(function(e){ return e.id !== id; });

/* ========== SUIVI SCOLAIRE ========== */
window._suiviChild = window._suiviChild || 0;
window._suiviTab = window._suiviTab || "notes";

function gradeClass(score, max){
  var pct = (score / (max || 20)) * 100;
  if (pct >= 70) return "grade-good";
  if (pct >= 50) return "grade-mid";
  return "grade-low";
}

function myChildrenList(){
  if (isAdmin()) {
    // Admin: all unique students from parents
    var list = [];
    (state.parents || []).forEach(function(p){
      var kids = (p.children && p.children.length) ? p.children : (p.student ? [{ name: p.student, className: p.className, parentId: p.id, parentName: p.name }] : []);
      kids.forEach(function(c){
        list.push({ name: c.name, className: c.className, parentId: p.id, parentName: p.name });
      });
    });
    return list;
  }
  if (isTeacher()) {
    var t = currentTeacher();
    if (!t) return [];
    var allowedClasses = t.classes || [];
    var list = [];
    (state.parents || []).forEach(function(p){
      var kids = (p.children && p.children.length) ? p.children : (p.student ? [{ name: p.student, className: p.className }] : []);
      kids.forEach(function(c){
        if (allowedClasses.indexOf(c.className) !== -1) {
          list.push({ name: c.name, className: c.className, parentId: p.id, parentName: p.name });
        }
      });
    });
    return list;
  }
  var p = currentParent();
  if (!p) return [];
  var kids = (p.children && p.children.length) ? p.children : (p.student ? [{ name: p.student, className: p.className }] : []);
  return kids.map(function(c){ return { name: c.name, className: c.className, parentId: p.id, parentName: p.name }; });
}

function suiviView(){
  var admin = isAdmin();
  var children = myChildrenList();
  if (!children.length) {
    return '<div class="panel-head"><h1>Suivi scolaire</h1></div>'
      + '<div class="panel"><div class="empty">' + (admin ? "Aucun élève enregistré. Ajoutez des parents avec leurs enfants." : "Aucun élève associé à votre compte.") + '</div></div>';
  }

  if (window._suiviChild >= children.length) window._suiviChild = 0;
  var child = children[window._suiviChild];
  var tab = window._suiviTab || "notes";

  var tabs = children.map(function(c, i){
    return '<button class="child-tab' + (i === window._suiviChild ? ' active' : '') + '" onclick="window._suiviChild=' + i + ';go(\'suivi\')">'
      + esc(c.name) + ' <span class="muted">(' + esc(c.className) + ')</span></button>';
  }).join("");

  var subTabs = [
    { id: "notes", label: "📝 Notes" },
    { id: "bulletins", label: "📋 Bulletins" },
    { id: "absences", label: "📅 Absences" }
  ].map(function(t){
    return '<button class="btn ' + (tab === t.id ? 'primary' : 'secondary') + '" onclick="window._suiviTab=\'' + t.id + '\';go(\'suivi\')">' + t.label + '</button>';
  }).join(" ");

  var body = "";
  if (tab === "notes") body = suiviNotes(child, admin);
  else if (tab === "bulletins") body = suiviBulletins(child, admin);
  else body = suiviAbsences(child, admin);

  return '<div class="panel-head">'
    + '<div><h1>Suivi scolaire</h1><p class="muted">' + (admin ? "Consultation et saisie des résultats." : "Suivez la progression de votre/vos enfant(s).") + '</p></div>'
    + (admin ? '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" onclick="newGrade()">+ Note</button> <button class="btn secondary" onclick="newAbsence()">+ Absence</button> <button class="btn secondary" onclick="newBulletin()">+ Bulletin</button> <button class="btn secondary" onclick="exportGradesCsv()">⬇ Notes</button> <button class="btn secondary" onclick="exportAbsencesCsv()">⬇ Absences</button></div>'
      : (isTeacher() ? '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" onclick="newGrade()">+ Saisir une note</button> <button class="btn secondary" onclick="exportGradesCsv()">⬇ Mes notes CSV</button></div>' : ''))
    + '</div>'
    + '<div class="child-tabs">' + tabs + '</div>'
    + '<div style="margin:8px 0;display:flex;gap:8px;flex-wrap:wrap;align-items:center">'
    + subTabs
    + ' <button class="btn secondary" onclick="printStudentRecap(' + JSON.stringify(child.name) + ', ' + JSON.stringify(child.className || '') + ')">🖨 Récapitulatif</button>'
    + '</div>'
    + body;
}

function suiviNotes(child, admin){
  var grades = (state.grades || []).filter(function(g){
    return g.student === child.name && g.className === child.className;
  });
  // Group by sequence
  var bySeq = {};
  grades.forEach(function(g){
    if (!bySeq[g.sequence]) bySeq[g.sequence] = [];
    bySeq[g.sequence].push(g);
  });
  var seqs = Object.keys(bySeq);
  if (!seqs.length) return '<div class="panel"><div class="empty">Aucune note pour ' + esc(child.name) + '.</div></div>';

  return seqs.map(function(seq){
    var rows = bySeq[seq].map(function(g){
      var cls = gradeClass(g.score, g.max);
      return '<tr>'
        + '<td>' + esc(g.subject) + '</td>'
        + '<td class="' + cls + '">' + g.score + ' / ' + (g.max || 20) + '</td>'
        + '<td class="muted">' + esc(g.date || '') + '</td>'
        + '<td>' + esc(g.comment || '—') + '</td>'
        + ((admin || (isTeacher() && currentTeacher() && (currentTeacher().subjects||[]).indexOf(g.subject)!==-1)) ? '<td><button class="btn danger" style="padding:4px 8px;font-size:12px" onclick="deleteGrade(' + g.id + ')">✕</button></td>' : '')
        + '</tr>';
    }).join("");
    // moyenne séquence
    var sum = bySeq[seq].reduce(function(s, g){ return s + (g.score / (g.max || 20)) * 20; }, 0);
    var avg = (sum / bySeq[seq].length).toFixed(2);
    return '<div class="panel"><div class="panel-head"><h3>' + esc(seq) + '</h3>'
      + '<span class="badge">Moyenne : ' + avg + ' / 20</span></div>'
      + '<table class="grade-table"><thead><tr><th>Matière</th><th>Note</th><th>Date</th><th>Appréciation</th>'
      + (admin || isTeacher() ? '<th></th>' : '') + '</tr></thead><tbody>' + rows + '</tbody></table></div>';
  }).join("");
}

function suiviBulletins(child, admin){
  var bulls = (state.bulletins || []).filter(function(b){
    return b.student === child.name && b.className === child.className;
  }).slice().reverse();

  if (!bulls.length) return '<div class="panel"><div class="empty">Aucun bulletin publié pour ' + esc(child.name) + '.</div></div>';

  return bulls.map(function(b){
    if (b.type === "trimestriel") {
      return '<div class="panel">'
        + '<div class="alert-bulletin">'
        + '<b>📢 Bulletin trimestriel disponible</b>'
        + '<p style="margin:8px 0 0">Le bulletin de <b>' + esc(b.sequence) + '</b> est disponible à retirer au collège.</p>'
        + '<p style="margin:6px 0 0;font-size:13px">Il doit être retiré <b>par l\'élève</b> auprès de l\'administration. Les détails ne sont pas consultables en ligne.</p>'
        + '<p class="muted" style="margin:6px 0 0">Publié le ' + esc(b.publishedAt || '') + '</p>'
        + '</div>'
        + (admin ? '<button class="btn danger" style="margin-top:10px" onclick="deleteBulletin(' + b.id + ')">Supprimer l\'alerte</button>' : '')
        + '</div>';
    }
    // séquentiel — détails visibles
    return '<div class="panel">'
      + '<div class="item-head"><h3>Bulletin — ' + esc(b.sequence) + '</h3>'
      + '<span class="badge">Séquentiel</span></div>'
      + '<div class="grid2" style="margin-top:12px">'
      + '<div><span class="muted">Moyenne générale</span><div class="num" style="font-size:22px">' + (b.average != null ? b.average + ' / 20' : '—') + '</div></div>'
      + '<div><span class="muted">Rang</span><div style="font-size:18px;font-weight:700;margin-top:8px">' + esc(b.rank || '—') + '</div></div>'
      + '<div><span class="muted">Mention</span><div style="font-size:16px;font-weight:700;margin-top:8px">' + esc(b.mention || '—') + '</div></div>'
      + '<div><span class="muted">Publié le</span><div style="margin-top:8px">' + esc(b.publishedAt || '—') + '</div></div>'
      + '</div>'
      + (b.appreciation ? '<p style="margin-top:14px"><b>Appréciation :</b> ' + esc(b.appreciation) + '</p>' : '')
      + '<div style="margin-top:12px">'
      + (b.fileData ? '<a class="btn primary" style="display:inline-block;text-decoration:none;margin-right:6px" href="' + b.fileData + '" download="' + esc(b.fileName || ('Bulletin_' + b.sequence + '.pdf')) + '">⬇ Télécharger le bulletin officiel</a>' : '')
      + '<button class="btn secondary" onclick="printBulletin(' + b.id + ')">🖨 Imprimer le récapitulatif</button> '
      + (admin ? '<button class="btn danger" onclick="deleteBulletin(' + b.id + ')">Supprimer</button>' : '')
      + '</div></div>';
  }).join("");
}

function suiviAbsences(child, admin){
  var abs = (state.absences || []).filter(function(a){
    return a.student === child.name && a.className === child.className;
  }).slice().reverse();

  var just = abs.filter(function(a){ return a.status === "justified" || a.justified; }).length;
  var pending = abs.filter(function(a){ return a.status === "pending"; }).length;
  var open = abs.filter(function(a){ return a.status === "open" || (!a.status && !a.justified); }).length;
  var rejected = abs.filter(function(a){ return a.status === "rejected"; }).length;

  var summary = '<div class="cards" style="margin-bottom:14px">'
    + '<div class="card"><span class="muted">Total</span><div class="num">' + abs.length + '</div></div>'
    + '<div class="card"><span class="muted">Justifiées</span><div class="num" style="color:#059669">' + just + '</div></div>'
    + '<div class="card"><span class="muted">En attente</span><div class="num" style="color:#d97706">' + pending + '</div></div>'
    + '<div class="card"><span class="muted">Non justifiées</span><div class="num" style="color:#dc2626">' + (open + rejected) + '</div></div>'
    + '</div>';

  if (!abs.length) return '<div class="panel">' + summary + '<div class="empty">Aucune absence enregistrée.</div></div>';

  function statusLabel(a){
    var s = a.status || (a.justified ? "justified" : "open");
    if (s === "justified") return '<span class="status-pill status-justified">✓ Justifiée</span>';
    if (s === "pending") return '<span class="status-pill status-pending">⏳ En attente de validation</span>';
    if (s === "rejected") return '<span class="status-pill status-rejected">✗ Refusée</span>';
    return '<span class="status-pill status-open">✗ Non justifiée</span>';
  }

  var cards = abs.map(function(a){
    var s = a.status || (a.justified ? "justified" : "open");
    var actions = "";
    // Parent: can justify open or rejected
    if (!admin && (s === "open" || s === "rejected")) {
      actions = '<button class="btn primary" style="margin-top:8px" onclick="justifyAbsence(' + a.id + ')">📝 Justifier cette absence</button>';
    }
    // Admin: validate/reject pending
    if (admin && s === "pending") {
      actions = '<div style="margin-top:8px">'
        + '<button class="btn primary" onclick="reviewAbsence(' + a.id + ', true)">✓ Valider</button> '
        + '<button class="btn danger" onclick="reviewAbsence(' + a.id + ', false)">✗ Refuser</button>'
        + '</div>';
    }
    if (admin && (s === "open")) {
      actions = '<button class="btn secondary" style="margin-top:8px" onclick="reviewAbsence(' + a.id + ', true)">Marquer justifiée</button> '
        + '<button class="btn danger" style="margin-top:8px" onclick="deleteAbsence(' + a.id + ')">Supprimer</button>';
    }
    if (admin && (s === "justified" || s === "rejected")) {
      actions = '<button class="btn danger" style="margin-top:8px" onclick="deleteAbsence(' + a.id + ')">Supprimer</button>';
    }

    var justifHtml = "";
    if (a.justification && a.justification.text) {
      justifHtml = '<div style="margin-top:8px;padding:10px;background:var(--primary-soft);border-radius:8px;font-size:13px">'
        + '<b>Justificatif parent :</b> ' + esc(a.justification.text)
        + (a.justification.submittedAt ? ' <span class="muted">(' + esc(a.justification.submittedAt) + ')</span>' : '')
        + (a.justification.attach ? '<div class="attach-chip" style="margin-top:6px">📎 ' + esc(a.justification.attach.name)
          + (a.justification.attach.data ? ' <a href="#" onclick="event.preventDefault();downloadAttach(state.absences.find(function(x){return x.id===' + a.id + '}).justification.attach)">Télécharger</a>' : '')
          + '</div>' : '')
        + '</div>';
    }
    if (a.adminNote) {
      justifHtml += '<p class="muted" style="margin-top:6px;font-size:13px"><b>Admin :</b> ' + esc(a.adminNote)
        + (a.reviewedAt ? ' · ' + esc(a.reviewedAt) : '') + '</p>';
    }

    return '<div class="item" style="margin-bottom:10px">'
      + '<div class="item-head"><b>' + esc(a.date) + '</b>' + statusLabel(a) + '</div>'
      + '<p class="muted">' + esc(a.reason || '') + '</p>'

function submitJustification(id){
  var a = state.absences.find(function(x){ return x.id === id; });
  if (!a) return;
  var text = document.getElementById("jText").value.trim();
  if (!text) return toast("Indiquez un motif");

  if (btn) { btn.disabled = true; btn.textContent = "Envoi…"; }
  readAttachment(document.getElementById("jAttach")).then(function(attach){
    a.justification = { text: text, attach: attach, submittedAt: nowStr() };
    a.status = "pending";
    a.justified = false;
    a.reason = text.slice(0, 80);
    a.adminNote = null;
    a.reviewedAt = null;
    pushNotif("Justificatif d'absence reçu : " + a.student + " — " + a.date, "info", "absence", a.id);

function reviewAbsence(id, accept){
  var a = state.absences.find(function(x){ return x.id === id; });
  if (!a) return;
  var note = "";
  if (!accept) {
    note = prompt("Motif du refus (visible par le parent) :", "Justificatif insuffisant") || "Refusé";
  } else {
    note = "Validé par l'administration";
  }
  a.status = accept ? "justified" : "rejected";
  a.justified = accept;
  a.adminNote = note;
  a.reviewedAt = nowStr();
  if (accept && a.justification && a.justification.text) {
    a.reason = a.justification.text.slice(0, 100);
  }
  pushNotif(
    (accept ? "Absence validée : " : "Justificatif refusé : ") + a.student + " — " + a.date,
    "info", "absence", a.id
  );
  var absText = accept
    ? "Justificatif d'absence du " + a.date + " validé pour " + a.student
    : "Justificatif d'absence du " + a.date + " refusé pour " + a.student + ". Voir le portail.";
  triggerAutoSMS("absence", { student: a.student, text: absText });
  triggerAutoWhatsApp("absence", { student: a.student, text: absText });
  save();
  toast(accept ? "Absence marquée justifiée" : "Justificatif refusé");
  window._suiviTab = "absences";
  go("suivi");
}

/** Récapitulatif imprimable notes + absences pour un élève */
function printStudentRecap(student, className){
  if (!student) return toast("Élève introuvable");
  var grades = (state.grades || []).filter(function(g){
    return g.student === student && g.className === className;
  });
  var abs = (state.absences || []).filter(function(a){
    return a.student === student && a.className === className;
  }).slice().sort(function(a,b){ return (a.date < b.date ? 1 : -1); });
  var bulls = (state.bulletins || []).filter(function(b){
    return b.student === student && b.className === className;
  }).slice().reverse();

  // Group notes by sequence
  var bySeq = {};
  grades.forEach(function(g){
    if (!bySeq[g.sequence]) bySeq[g.sequence] = [];
    bySeq[g.sequence].push(g);
  });
  var seqs = Object.keys(bySeq);

  var gradesHtml = "";
  if (!seqs.length) {
    gradesHtml = '<p style="color:#68758a">Aucune note enregistrée.</p>';
  } else {
    seqs.forEach(function(seq){
      var sum = 0;
      bySeq[seq].forEach(function(g){ sum += (g.score / (g.max || 20)) * 20; });
      var avg = (sum / bySeq[seq].length).toFixed(2);
      gradesHtml += '<h3 style="margin:18px 0 8px;color:#1e3a8a;font-size:15px">' + esc(seq) + ' <span style="font-weight:400;color:#68758a;font-size:13px">— moyenne ' + avg + ' / 20</span></h3>';
      gradesHtml += '<table><thead><tr><th>Matière</th><th style="text-align:center">Note</th><th>Date</th><th>Appréciation</th></tr></thead><tbody>';
      bySeq[seq].forEach(function(g){
        gradesHtml += '<tr><td>' + esc(g.subject) + '</td>'
          + '<td style="text-align:center;font-weight:700">' + g.score + ' / ' + (g.max || 20) + '</td>'
          + '<td>' + esc(g.date || "—") + '</td>'
          + '<td>' + esc(g.comment || "—") + '</td></tr>';
      });
      gradesHtml += '</tbody></table>';
    });
  }

  var absJust = abs.filter(function(a){ return a.status === "justified" || a.justified; }).length;
  var absOpen = abs.filter(function(a){ return a.status === "open" || a.status === "pending" || a.status === "rejected" || (!a.status && !a.justified); }).length;
  var absHtml = "";
  if (!abs.length) {
    absHtml = '<p style="color:#68758a">Aucune absence enregistrée.</p>';
  } else {
    absHtml = '<p style="font-size:13px;color:#526078">Total : <b>' + abs.length + '</b> — Justifiées : <b style="color:#059669">' + absJust + '</b> — Non justifiées / en cours : <b style="color:#dc2626">' + absOpen + '</b></p>';
    absHtml += '<table><thead><tr><th>Date</th><th>Statut</th><th>Motif</th></tr></thead><tbody>';
    abs.forEach(function(a){
      var st = a.status || (a.justified ? "justified" : "open");
      var stLabel = st === "justified" ? "Justifiée" : st === "pending" ? "En attente" : st === "rejected" ? "Refusée" : "Non justifiée";
